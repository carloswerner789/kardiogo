<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1d4ed8"><link rel="manifest" href="manifest.webmanifest"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="KardioGo"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="apple-touch-icon" sizes="180x180" href="icon-180.png"><link rel="icon" type="image/png" sizes="32x32" href="icon-32.png"><link rel="icon" type="image/svg+xml" href="icon.svg"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style><title>KardioGo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&display=swap">
<style>
/* Layout: Kitteltaschen-Werkzeug. Sticky Kopf mit Suche/Gewicht, Inhalt als ruhige Liste, feste Tab-Leiste unten.
   Jeder Bereich trägt seine Farbe wie ein Spritzenetikett. */
:root{
  --bg:#f3f5fa; --surface:#ffffff; --sunk:#e9edf5; --fg:#0f1830; --muted:#566382; --line:#d6ddea;
  --accent:#1d4ed8; --on-accent:#ffffff;
  --c-perf:#d0103a; --c-nacht:#3b3fc4; --c-tel:#1d4ed8; --c-sop:#0e6fa8; --c-pan:#0f7d5a;
  --warn:#b42318; --warn-bg:#fdecee; --hi:#fff1cc; --hi-line:#e3b341; --ok:#1d7a3e;
  --f-body:"Figtree",ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-num:"Figtree",ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:12px; --tab-h:56px; --tab-pb:max(6px, calc(env(safe-area-inset-bottom,0px) - 12px));
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0a0f1e; --surface:#111a2e; --sunk:#18223a; --fg:#e7ecf7; --muted:#95a1bd; --line:#26314c;
  --accent:#7aa5ff; --on-accent:#0a1230;
  --c-perf:#ff6b81; --c-nacht:#a5a9ff; --c-tel:#7aa5ff; --c-sop:#6fc3f2; --c-pan:#4fd39a;
  --warn:#ff8b80; --warn-bg:#3b1519; --hi:#3a2f10; --hi-line:#b8902a; --ok:#6fd38f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a0f1e; --surface:#111a2e; --sunk:#18223a; --fg:#e7ecf7; --muted:#95a1bd; --line:#26314c;
  --accent:#7aa5ff; --on-accent:#0a1230;
  --c-perf:#ff6b81; --c-nacht:#a5a9ff; --c-tel:#7aa5ff; --c-sop:#6fc3f2; --c-pan:#4fd39a;
  --warn:#ff8b80; --warn-bg:#3b1519; --hi:#3a2f10; --hi-line:#b8902a; --ok:#6fd38f; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font:16px/1.45 var(--f-body);margin:0;-webkit-text-size-adjust:100%;font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1,"zero" 0}
input,button{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1,"zero" 0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Kopf */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;flex-direction:column;gap:8px;padding-block:10px}
.bar{display:flex;align-items:center;gap:10px;min-width:0}
.back{border:0;background:var(--sunk);border-radius:10px;width:40px;height:40px;flex:none;font-size:20px;cursor:pointer}
.ttl{flex:1;min-width:0}
.ttl b{display:block;font-size:19px;line-height:1.2;text-wrap:balance;overflow-wrap:anywhere}
.ttl small{display:block;color:var(--muted);font-size:13px}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:1px;background:var(--sec,var(--accent))}
.kg{display:flex;align-items:center;gap:4px;background:var(--sunk);border-radius:10px;padding:0 8px;height:40px;flex:none}
.kg input{width:52px;border:0;background:transparent;font-family:var(--f-num);font-size:17px;text-align:right;padding:0}
.kg input:focus{outline:none}
.kg span{color:var(--muted);font-size:13px}
.kg:focus-within{outline:2.5px solid var(--accent)}
.search{display:flex;align-items:center;gap:8px;background:var(--sunk);border-radius:10px;padding:0 12px;height:44px}
.search input{flex:1;min-width:0;border:0;background:transparent;font-size:16px;height:100%}
.search input:focus{outline:none}
.search:focus-within{outline:2.5px solid var(--accent)}
.search svg{flex:none;opacity:.6}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;margin:0 -2px}
.chips::-webkit-scrollbar{display:none}
.chips.sub{margin:0}
.chips.sub .chip{font-size:13.5px;padding:5px 11px}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--sec,var(--accent));border-color:transparent;color:var(--bg);font-weight:700}

main{padding-block:14px calc(var(--tab-h) + 24px + var(--tab-pb))}
main .wrap{display:flex;flex-direction:column;gap:14px}

/* Tab-Leiste */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:var(--tab-pb);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:center}
nav.tabs a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;height:var(--tab-h);padding-top:2px;text-decoration:none;color:var(--muted);font-size:11.5px;font-weight:700;letter-spacing:.02em}
nav.tabs a svg{width:23px;height:23px}
nav.tabs a[aria-current="page"]{color:var(--sec)}

/* Startseite */
.tiles{display:flex;flex-direction:column;gap:10px}
.tile{display:grid;grid-template-columns:auto 1fr auto;grid-template-rows:auto auto;column-gap:14px;align-items:center;padding:14px 16px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);text-decoration:none;color:var(--fg);position:relative;overflow:hidden}
.tile::before{content:"";position:absolute;inset:0 auto 0 0;width:5px;background:var(--sec)}
.tile svg{width:30px;height:30px;color:var(--sec);grid-row:1/3}
.tile::after{content:"›";grid-column:3;grid-row:1/3;color:var(--muted);font-size:22px}
.tile b{font-size:18px}
.tile small{color:var(--muted);font-size:13px;line-height:1.3;grid-column:2}
h2.sec{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:6px 0 -4px;font-weight:700}

/* Listen */
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:10px;padding:11px 14px;border-top:1px solid var(--line);text-decoration:none;color:var(--fg);min-height:52px}
.row:first-child{border-top:0}
a.row:active{background:var(--sunk)}
.row .main{flex:1;min-width:0}
.row .main b{font-size:16.5px}
.row .main .sub{color:var(--muted);font-size:13.5px;overflow-wrap:anywhere}
.row .rt{flex:none;text-align:right;font-family:var(--f-num);font-size:13.5px;color:var(--sec,var(--accent));white-space:nowrap}
.row .chev{color:var(--muted);flex:none}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 6px;border-radius:5px;background:var(--sunk);color:var(--muted);margin-right:6px;vertical-align:1px}
.empty{padding:22px 14px;color:var(--muted);text-align:center}

/* Perfusor-Detail */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.std{font-family:var(--f-num);font-size:15px;white-space:pre-line}
.conc{color:var(--muted);font-size:13.5px;margin-top:2px}
.seg{display:inline-flex;background:var(--sunk);border-radius:10px;padding:3px;gap:3px;margin-top:8px}
.seg button{border:0;background:transparent;border-radius:8px;padding:6px 10px;font-size:14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.15)}
.calc{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:8px;margin-top:4px}
.calc label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);font-weight:700;letter-spacing:.03em;min-width:0}
.calc input{width:100%;font-family:var(--f-num);font-size:24px;padding:8px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);min-width:0}
.calc input:focus{outline:none;border-color:var(--sec)}
.calc .eq{padding-bottom:12px;color:var(--muted);font-size:20px}
.dl{display:grid;grid-template-columns:auto 1fr auto;gap:0;margin-top:2px}
.dl > div{display:contents}
.dl dt,.dl dd{padding:9px 0;border-top:1px solid var(--line);margin:0}
.dl > div:first-child dt,.dl > div:first-child dd{border-top:0}
.dl dt{color:var(--muted);font-size:13.5px;padding-right:12px;font-weight:700}
.dl dd.v{font-family:var(--f-num);font-size:15px;white-space:pre-line;overflow-wrap:anywhere}
.dl dd.r{font-family:var(--f-num);font-size:15px;text-align:right;color:var(--sec);padding-left:10px;white-space:nowrap;font-weight:600}
.kom{font-size:15.5px}
.need{font-size:13.5px;color:var(--muted);margin-top:8px}
.rate{display:flex;flex-direction:column;gap:10px}
.dlab{font-size:12.5px;font-weight:700;letter-spacing:.03em;color:var(--muted)}
.dlab span{font-family:var(--f-num);font-weight:500}
.drow{display:flex;gap:8px;align-items:stretch}
.drow input{flex:1;min-width:0;font-family:var(--f-num);font-size:26px;padding:8px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg)}
.drow input:focus{outline:none;border-color:var(--sec)}
.stepb{flex:none;width:52px;border-radius:10px;border:1.5px solid var(--line);background:var(--sunk);font-size:26px;cursor:pointer}
.stepb:active{background:var(--line)}
.qchips{display:flex;flex-wrap:wrap;gap:6px}
.qchips button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 9px;font-family:var(--f-num);font-size:14px;cursor:pointer}
.qchips button small{font-family:var(--f-body);color:var(--muted);font-size:12px}
.qchips button[aria-pressed="true"]{border-color:var(--sec);box-shadow:inset 0 0 0 1px var(--sec)}
.big{display:flex;align-items:baseline;gap:8px;padding:12px 14px;border-radius:12px;background:var(--sunk);min-height:76px}
.big .v{font-family:var(--f-num);font-size:46px;font-weight:600;line-height:1;color:var(--sec);font-variant-numeric:tabular-nums}
.big .mlh{font-size:20px;font-weight:700;color:var(--sec)}
.big .mute{color:var(--muted);font-size:17px;align-self:center}
.kg.ask{outline:2.5px solid var(--warn)}
.crow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.crow input{flex:1 1 90px;min-width:0;font-family:var(--f-num);font-size:22px;padding:8px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg)}
.crow select{flex:0 0 auto;font:inherit;font-size:16px;padding:10px 8px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg)}
.crow input:focus,.crow select:focus{outline:none;border-color:var(--sec)}
.crow .in{color:var(--muted);font-size:14px}
.calcchip{text-decoration:none;color:var(--sec);border-color:var(--sec);font-weight:700}
.tbl-narrow{display:none}
@media (max-width:700px){.tbl-wide{display:none}.tbl-narrow{display:block}}
.pcards{display:flex;flex-direction:column;gap:8px}
.pcard{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.pcard.hl-green{border-color:color-mix(in srgb,var(--c-pan) 55%,transparent);background:color-mix(in srgb,var(--c-pan) 8%,transparent)}
.pc-h{background:var(--sunk);padding:8px 10px;font-weight:700}
.pc-row{padding:8px 10px;display:flex;flex-direction:column;gap:5px;border-top:1px solid var(--line)}
.pc-h+.pc-row{border-top:0}
.pc-tag{align-self:flex-start;font-size:12.5px;font-weight:700;color:var(--sec);background:color-mix(in srgb,var(--c-pan) 12%,transparent);border-radius:6px;padding:2px 7px}
.pc-f{display:grid;grid-template-columns:92px 1fr;gap:8px;font-size:14.5px}
.pc-f span{font-size:12px;color:var(--muted);font-weight:600;padding-top:2px;overflow-wrap:anywhere;hyphens:auto}
.pc-sep{text-align:center;font-weight:700;color:var(--muted);font-size:13px}
.bodybox{display:flex;flex-direction:column;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.bodyfig{height:min(48vh,400px);width:auto;max-width:100%;display:block;background:#fff;border-radius:10px}
.bodyfig .reg{fill:transparent;cursor:pointer}
.bodyfig .reg:hover,.bodyfig .reg:focus,.bodyfig .reg.on{fill:var(--c-pan);fill-opacity:.32;outline:none}
.regbtns{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.regbtns button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:7px 12px;font-weight:600;font-size:14.5px;cursor:pointer;color:var(--fg)}
.regbtns button[aria-pressed="true"]{background:var(--c-pan);border-color:transparent;color:#fff}
.cgrid{display:flex;flex-direction:column;gap:10px}
.ccard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.ccard-h{display:flex;gap:10px;align-items:center;padding:12px 14px;text-decoration:none;color:var(--fg)}
.ccard-h b{flex:1;min-width:0}
.ccard-s{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.ccard-s a{padding:9px 14px 9px 50px;text-decoration:none;color:var(--fg);font-size:14.5px;border-top:1px solid var(--line)}
.ccard-s a:first-child{border-top:0}
.ccard-s a b{color:var(--sec)}
.pc-src{display:block;padding:7px 10px;font-size:12.5px;font-weight:700;color:var(--sec);text-decoration:none;border-bottom:1px solid var(--line)}
.rpill{display:inline-block;padding:1px 9px;border-radius:6px}
.chno{flex:none;min-width:36px;font-weight:700;color:var(--sec);font-variant-numeric:tabular-nums}
.psec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.psec>summary{list-style:none;cursor:pointer;padding:13px 14px;font-weight:600;display:flex;gap:8px;align-items:flex-start}
.psec>summary::-webkit-details-marker{display:none}
.psec>summary::after{content:"›";margin-left:auto;color:var(--muted);transition:transform .15s}
.psec[open]>summary::after{transform:rotate(90deg)}
.psec[open]>summary{border-bottom:1px solid var(--line);color:var(--sec)}
.sno{color:var(--sec)}
.pdoc{padding:12px 14px}
.ptbl{overflow-x:auto;margin:0 -14px;padding:0 14px}
.ptbl table{border-collapse:collapse;font-size:14px;min-width:560px;width:100%}
.ptbl th,.ptbl td{text-align:left;vertical-align:top;padding:7px 8px;border:1px solid var(--line)}
.ptbl thead th{background:var(--sunk);font-size:12.5px;color:var(--muted)}
.ptbl tbody th{background:var(--sunk);font-weight:600}
.ptbl tr.sep td{background:transparent;border-left:0;border-right:0;text-align:center;font-weight:700;color:var(--muted);padding:3px}
.ptbl tr.hl-green td{background:color-mix(in srgb,var(--c-pan) 14%,transparent)}
.rc{text-align:center!important;font-weight:600}
.rc-green{background:color-mix(in srgb,#22a35a 22%,transparent)}
.rc-yellow{background:color-mix(in srgb,#e3b341 30%,transparent)}
.rc-red{background:color-mix(in srgb,#e5484d 30%,transparent)}
.rc-grey{color:var(--muted)}
.legend{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center}
.hlsw{width:14px;height:14px;border-radius:3px;background:color-mix(in srgb,var(--c-pan) 30%,transparent);flex:none}
.miss{color:var(--muted)}
.warnlist li{color:var(--warn)}
.crit{background:var(--sunk);border-radius:10px;padding:10px 12px}
.crit ul{margin-top:6px}
.fn{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px}
.fni{display:flex;gap:6px}
.fni.w{color:var(--warn)}
.fm{flex:none;color:var(--sec);font-weight:700}
.rev summary{cursor:pointer;color:var(--muted);font-size:14px}
.revrow{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.revrow input{width:110px;font-family:var(--f-num);font-size:18px;padding:6px 8px;border-radius:8px;border:1.5px solid var(--line);background:var(--bg)}
.revrow b{font-family:var(--f-num);color:var(--sec)}
.srcnote{font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.kom13{margin-top:10px;font-size:15px}
.info{margin-top:8px;font-size:13px;line-height:1.4;color:var(--muted)}
.info .tag{font-size:10px;padding:1px 5px;margin-right:6px}
.big .bd{margin-left:auto;font-family:var(--f-num);font-size:14px;color:var(--muted)}
.refs{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.ref{display:grid;grid-template-columns:78px 1fr auto;gap:8px;align-items:baseline;padding:8px 0;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;font:inherit;color:inherit;width:100%}
button.ref{cursor:pointer}
button.ref[aria-pressed="true"] .rl{color:var(--sec)}
.ref .rl{font-size:12.5px;font-weight:700;color:var(--muted)}
.ref .rt2{font-family:var(--f-num);font-size:12.5px;color:var(--muted);white-space:pre-line;overflow-wrap:anywhere;min-width:0}
.ref:not(:has(.ml)) .rt2{font-size:15px;color:var(--fg)}
.ref .ml{font-family:var(--f-num);font-size:18px;color:var(--sec);white-space:nowrap;text-align:right}
.ref .ml small{font-size:12px}
.ref .ml.mute{color:var(--muted);font-size:14px}
.lad{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:6px}
.lad button{display:flex;flex-direction:column;align-items:center;gap:1px;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:6px 4px;cursor:pointer}
.lad button b{font-family:var(--f-num);font-size:16px;color:var(--sec)}
.lad button small{font-family:var(--f-num);font-size:11.5px;color:var(--muted)}
.lad button[aria-pressed="true"]{border-color:var(--sec);box-shadow:inset 0 0 0 1px var(--sec)}
.lad .dots{align-self:center;text-align:center;color:var(--muted)}
.warnbox{margin-top:0}
.formula{margin-top:0;font-family:var(--f-num);font-size:13.5px;color:var(--muted);overflow-wrap:anywhere}
.formula b{color:var(--sec)}
.ph.pg{border-color:var(--c-tel)}
.ph .pgl{font-family:var(--f-body);font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--c-tel)}
mark.w{background:transparent;color:var(--warn);font-weight:700}
.warnbox{background:var(--warn-bg);color:var(--fg);border-radius:10px;padding:10px 12px;font-size:15px}
.warnbox b{color:var(--warn)}

/* Textinhalte (Nachtdienst/SOP) */
.doc{display:flex;flex-direction:column;gap:10px}
.doc h3{font-size:15px;margin:6px 0 -4px;color:var(--sec)}
.doc h3.w{color:var(--warn)}
.doc ul,.doc ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px}
.doc li{padding-left:2px}
.doc li::marker{color:var(--sec)}
.doc ul ul{margin-top:6px;gap:4px;list-style:circle}
.doc p{margin:0}
.ddl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px}
.ddl dt{font-weight:700}
.ddl dd{margin:0}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;font-size:15px;min-width:240px}
.tbl th,.tbl td{text-align:left;padding:7px 14px 7px 0;border-bottom:1px solid var(--line);white-space:pre-line;vertical-align:top}
.tbl th{font-size:12.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.ttabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.ttabs::-webkit-scrollbar{display:none}
.ttabs button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 13px;font-size:14.5px;cursor:pointer;white-space:nowrap}
.ttabs button[aria-pressed="true"]{background:var(--sec);color:var(--bg);border-color:transparent;font-weight:700}
.ttabs button.w:not([aria-pressed="true"]){color:var(--warn);border-color:var(--warn)}
.xref{display:inline-flex;align-items:center;gap:6px;font-size:14px;text-decoration:none;color:var(--sec);border:1px dashed var(--sec);border-radius:8px;padding:6px 10px;align-self:flex-start}

/* Werkzeuge */
.tool{background:var(--sunk);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px}
.tool .in{display:flex;gap:8px;flex-wrap:wrap;align-items:end}
.tool label{display:flex;flex-direction:column;gap:3px;font-size:12.5px;font-weight:700;color:var(--muted)}
.tool input{width:96px;font-family:var(--f-num);font-size:20px;padding:6px 8px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface)}
.tool input:focus{outline:none;border-color:var(--sec)}
.tool .res{font-family:var(--f-num);font-size:20px;font-weight:600;color:var(--sec)}
.tool .res small{font-family:var(--f-body);font-size:13px;color:var(--muted);font-weight:400}
.steps{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:6px}
.steps li{display:flex;gap:10px;padding:8px 10px;border-radius:9px;background:var(--surface);border:1px solid var(--line)}
.steps li .n{flex:none;font-family:var(--f-num);font-weight:600;width:20px;color:var(--muted)}
.steps li.on{background:var(--hi);border-color:var(--hi-line)}
.steps li.on .n{color:var(--fg)}

/* Telefon */
.ph{display:inline-flex;align-items:center;gap:4px;font-family:var(--f-num);font-weight:600;font-size:15px;border:1px solid var(--line);background:var(--sunk);color:var(--fg);border-radius:8px;padding:4px 8px;cursor:pointer;white-space:nowrap;vertical-align:baseline;line-height:1.25}
.ph small{font-family:var(--f-body);font-weight:400;font-size:11.5px;color:var(--muted)}
.ph:active{background:var(--line)}
.doc .ph{font-size:14px;padding:1px 6px}
.trow{display:flex;gap:10px;padding:10px 14px;border-top:1px solid var(--line);align-items:flex-start}
.trow:first-child{border-top:0}
.trow .main{flex:1;min-width:0}
.trow .main b{font-weight:700;overflow-wrap:anywhere}
.trow .note{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.trow .nums{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.star{border:0;background:transparent;font-size:20px;line-height:1;cursor:pointer;color:var(--line);padding:2px;flex:none}
.star[aria-pressed="true"]{color:var(--hi-line)}
.dhead{padding:8px 14px;background:var(--sunk);font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.callx{font-size:12px;margin-left:2px}

.pdf{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--muted);text-decoration:none;border:1px solid var(--line);border-radius:8px;padding:6px 10px;align-self:flex-start;background:var(--surface)}
.stand{color:var(--muted);font-size:13px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tab-h) + 14px + var(--tab-pb));background:var(--fg);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:14.5px;z-index:40;opacity:0;transition:opacity .15s;pointer-events:none}
.toast.on{opacity:1}
.hint{color:var(--muted);font-size:13px;text-align:center}
.logo{width:40px;height:40px;border-radius:10px;flex:none}
.themebtn{border:0;background:var(--sunk);border-radius:10px;width:40px;height:40px;flex:none;cursor:pointer}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}

</style>

        { h: "Therapie" },
        { ul: ["500mg Perchlorat (= 35 Tropfen IRENAT) p.o. 2 - 4 h vor und 2 - 4 h nach Gabe von jodhältigem Kontrastmittel.", "Anschließend 3 x 300mg Perchlorat (= 21 Tropfen IRENAT) p.o. und 2x täglich Thiamazol 20mg über einen Zeitraum von zwei Wochen, danach Dosisanpassung"] },
        { xref: ["nacht", "jod", "Nachtdiensthilfe: Jod-Vorbereitung vor HK"] }

    { id: "vad", t: "VAD – Ventricular Assist Devices", stand: "13H3 · gültig ab 01.05.2019", tabs: [
      { t: "Notfall · CPR", blocks: [
        { h: "Notfälle", hw: 1 },
        { p: "Sollte ein Notfall vorliegen, so ist in jedem Fall der/die VAD - KoordinatorIn unter der Notrufnummer Klappe [[22000]] zu verständigen. Bei nicht Erreichen OP II unter Klappe [[52620]]." },
        { h: "Defibrillation und Reanimation" },
        { ul: ["Die Defibrillation ist sowohl intern als auch extern möglich. Hierzu sind keine Geräte-protektiven Maßnahmen erforderlich. Die Defibrillationselektroden können an den üblichen Stellen angebracht werden. Es werden keine Veränderungen am VAD vorgenommen.", "Die Herzdruckmassage wird gemäß der ERC-Guidelines durchgeführt. Die Herzdruckmassage kann aufgrund der Position der Pumpe und der Position der Ausflusskanüle an der Aorta ein Risiko darstellen.", "Nach Herzdruckmassage wird die Überprüfung der ordnungsgemäßen Funktion und Position des VAD mittels TEE und ergänzendem C/P empfohlen. Ereignet sich die Reanimation innerhalb weniger Tage nach der VAD-Implantation, sollte Rücksprache mit den Chirurgen bezüglich einer eventuell nötigen Revisionsoperation gehalten werden.", "In jedem Fall sollte aber nach jeder Reanimation die Chrirurgie und die/der VADK durch die/den diensthabende/n Ärztin/Arzt verständigt werden."] },
        { h: "Alarme" },
        { ul: ["Die Alarme sind nach hoher, mittlerer und niedriger Dringlichkeit klassifiziert. Es ist immer eine Kombination aus visuellem und akustischem Alarm.", "Alarme mit hoher Dringlichkeit können nicht stumm geschaltet werden (z.B. „Keine Stromquelle“, „VAD gestoppt“ oder „Steuereinheit defekt“).", "Bei Unklarheiten und Problemen kann der/die VADK jederzeit verständigt werden.", "Kurzübersicht der wichtigsten Alarme auf jedem Wagen der VADK; „Alarm – Folder“ in den Hängeordnern am Stützpunkt."] }
      ] },
      { t: "Kontrollen · Monitoring", blocks: [
        { h: "Kontrollen bei Patientenübernahme" },
        { ul: ["Ordnungsgemäß am Patienten gesicherter Systemcontroller inklusive Zugentlastung der Driveline", "Driveline nicht geknickt oder verdreht", "Driveline frei von Beschädigungen (Risse, Löcher, Sprödigkeit, Blut im Lumen)", "Netzkabel nicht geknickt oder verdreht", "Systemcontroller vor Feuchtigkeit geschützt", "Verbandkontrolle der Driveline Austrittsstelle", "Ordnungsgemäß an der Ladestation angeschlossenes Netzkabel", "Systemcontroller mit zwei Stromquellen verbunden (AC/DC Adapter oder Akkus)", "Überprüfung des Akkuladestatus in der Akkuladestation", "Überprüfung des Stromversorgungsmodules", "Überprüfung ob Alarmübersicht-Folder vorhanden"] },
        { h: "HeartMate III®" },
        { ul: ["Netzanzeige grün (Gelbes Akkusymbol: interner Akku des Stromversorgungsmoduls < 15 Minuten Restkapazität)", "Akkusymbol grün (gelb = interner Akku wird geladen)", "Anzeige: „HeartMate CHARGER“", ["Ladeschacht 1 – 4 Kontrollleuchten", ["Grün: Akku geladen und einsatzbereit", "Gelb: Akku wird geladen getestet oder kalibriert", "Gelb blinkt: Akku muss kalibriert werden", "Rot: Akku oder Ladeschacht defekt"]]] },
        { h: "HVAD HeartWare®" },
        { ul: ["Kontrollleuchte „Ready“ grün (Akku einsatzbereit)", "Kontrollleuchte „Status“ inaktiv (Akku nicht angeschlossen oder bereit); Gelb: Akku wird geladen (nicht verwenden)", "Netzanzeige grün"] },
        { h: "Dokumentation (Ärzt:innen 13H3)" },
        { ul: ["„Flow“, „Speed“, „Power“, „Pulsabilität“ oder „Waveness“ ein- bis dreimal täglich und bei jeder Änderung dokumentieren.", "Einstellungen am VAD ausschließlich durch Ärztinnen und Ärzte der Station 13H3 bzw. VADK."] },
        { h: "Spezielles Monitoring" },
        { ul: ["Geringerer oder fehlender pulsatiler Fluss: Pulsoxymetrie sowie arterielle und nichtinvasive Blutdruckmessung betroffen.", "Abweichung von Stationsstandards als AAO im PDMS dokumentieren.", "Alarm „statischer Druck“ bei arterieller Messung: nach AAO „ART“ auf „ICP“ umstellen (nur Mitteldruck)."] }
      ] },
      { t: "Transport · Mobilisation", blocks: [
        { h: "Transport" },
        { ul: ["Jeglicher Transport sollte gemeinsam mit einer/einem VADK durchgeführt werden.", "Neben Defibrillator und Notfallmedikamenten sind zwei geladene Akkus am Gerät sowie ein Ersatzakku mitzuführen.", "Beim Umlagern: Systemcontroller gesichert, niemals Zug an der Driveline Austrittsstelle.", "OP-Transfer: zusätzlich Wagen mit Konsole, Bildschirm und Netzgerät mitführen.", "Ohne VADK: die/der transportierende Ärztin/Arzt ist in allen Belangen für das VAD verantwortlich."] },
        { h: "Mobilisation und Lagerung" },
        { ul: ["Frühmobilisation anstreben; erstes Aufsetzen ins Querbett im Beisein einer/eines VADK.", "Vorher ausreichender Volumenstatus (orthostatische Synkopen → Ansaugen des VAD).", "Netzkabel und Driveline nicht diskonnektieren, verdrehen oder knicken.", "Bei VAD Fehlfunktionen oder Kreislaufdefiziten Mobilisation abbrechen.", "Netzbetrieb möglich; bei Mobilisation „gehen“ auf Akkubetrieb umstellen."] }
      ] },
      { t: "Sonstiges · Exitus", blocks: [
        { h: "Sonstige Informationen" },
        { ul: ["Driveline oder Anschlüsse beschädigt → VADK umgehend verständigen.", "Sturz des Systemcontrollers → VADK umgehend verständigen.", "Veränderungen der Pumpenfunktion (Stromaufnahme, Pumpenindex, etc.), Geräusche → Ärztin/Arzt 13H3.", "Smartphones, Tablets, Computer: Mindestabstand 10cm zum Systemcontroller.", "Keine Magnetresonanz Tomographie und Stoßwellentherapie möglich.", "Therapeutische Ultraschallenergiepegel meiden.", "Keine Verfahren mit Hochspannungsgeräten (z.B. Diathermie).", "Keine Mehrfachsteckdosen verwenden.", "Gerinnungsmanagement: partielle Thromboplastinzeit, Thrombinzeit, Hämatokrit, freies Hämoglobin und Lactatdehydrogenase (Thrombenbildung).", "Thoraxdrainagen nach AAO ehest möglich entfernen.", "Bei Schrittmacherimplantationen kann es nötig sein, das VAD intraoperativ mit Akkus zu versorgen.", "Driveline-Verband: keine Lösungsmittel, Desinfektionsmittel, Wundbenzin, Salben (Kortison, Antimycotika, Jod oder Antibiotika).", "Weitere Informationen: AKH Netzlaufwerk J:/Kunstherz"] },
        { h: "Todesfall" },
        { ul: ["Im Falle eines Exitus ist es nötig das VAD abzuschalten; VAD mit allen Komponenten auf Station lagern, wird von VADK abgeholt.", "VADK bei terminalen Patient:innen wenn möglich zum Sterbeprozess und Abschalten hinzuziehen."] },
        { h: "Abschalten HeartWare® HVAD" },
        { p: "Weiße Driveline Abdeckung entfernen. Driveline Sicherungsring aufschrauben und die Driveline vom Systemcontroller abziehen. Am Bildschirm des Systemcontrollers erscheint „VAD gestoppt“. Es ertönt nach 10 Sekunden ein akustischer und optischer Alarm. Der Controller kann nun mittels drücken und halten der „Stummschaltetaste“ und der Bildlauftaste (⇑) solange bis ein Piepton ertönt ausgeschalten werden. Beide Stromquellen vom Systemcontroller trennen. Die Steuereinheit ist nun abgeschaltet. Das VAD kann auch über den Systemmonitor abgeschaltet werden. Passwort: 68773" },
        { h: "Abschalten HeartMate III®" },
        { p: "Driveline Sicherungslasche an der Rückseite des Systemcontrollers entriegeln. Driveline vom Systemcontroller abziehen. Am Display erscheint „Steuerleitung anschließen“. Das sonst grüne Pumpensymbol erlischt und es ertönt ein Alarmton. Nun beide Stromversorgunsquellen entfernen. Das Gerät wird jetzt vom integrierten 11V-Lithiumionen-Akku betrieben. Durch Drücken der Anzeigetaste wird der Systemcontroller in den Standby-Modus versetzt." }
      ] }
    ], pdf: "pdfs/vad-ventricular-assist-devices.pdf" }

const PANTHER = {"documents": [{"id": "kap02", "chapter": "02", "title": "Meningitis", "sections": [{"id": "kap02-diagnostik", "number": null, "title": "Diagnostische Empfehlungen/ Erforderliche Diagnostik", "blocks": [{"type": "paragraph", "text": "Bei Verdacht auf ambulant erworbener Meningitis soll bei Lumbalpunktion Liquor sowohl für eine Kultur als auch einmalig für eine PCR Meningitis Panel (häufigste ambulante Meningitis Erreger) und eine PCR auf Herpesviren (eingeschränkte Sensitivität im Panel) eingesendet werden."}]}, {"id": "kap02-therapeutisch", "number": null, "title": "Therapeutische Empfehlungen", "blocks": [{"type": "bullets", "items": ["Bei klinischem Verdacht auf bakterielle Meningitis sollten 12 mg Dexamethason i.v. (3 Amp. à 4 mg) vor Gabe des Antibiotikums gegeben werden.", "Die Behandlung wird mit 4x10 mg/Tag Dexamethason über 4 Tage fortgesetzt. Sobald der Erregernachweis vorliegt, ist die Indikation zur Dexamethasongabe zu überprüfen. Durch Studien gesichert ist eine positive Beeinflussung des Verlaufes bei Pneumokokken. Bei allen übrigen Keimen kann Dexamethason abgesetzt werden.", "Je nach Erregernachweis/Antibiogramm muss die empirische Therapie reevaluiert und ggf. angepasst werden.", "Patienten mit Verdacht auf eine bakterielle Meningitis müssen bis 24 Stunden nach Beginn einer adäquaten Antibiotikatherapie isoliert werden.", "Namentliche Meldepflicht innerhalb von 24 Stunden bei Krankheitsverdacht, Erkrankung oder Tod durch Meningokokken-Meningitis beachten.", "Postexpositionsprophylaxe beachten."]}]}, {"id": "kap02-2-1", "number": "2.1", "title": "Bakterielle Meningitis – empirisch, ambulant erworben", "blocks": [{"type": "therapyTable", "columns": ["Mögliche Erreger", "", "Therapie", "Dosierung", "Therapiedauer"], "rows": [{"cells": [{"text": "Pneumokokken\nMeningokokken\nHaemophilus influenzae\nListeria monocytogenes\nStaphylokokken\nEnterobacterales"}, {"text": "1. Wahl"}, {"text": "Ceftriaxon\n+\nAmpicillin\n+\nAciclovir ①"}, {"tex
