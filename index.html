<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1d4ed8"><link rel="manifest" href="manifest.webmanifest"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="KardioGo"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="apple-touch-icon" sizes="180x180" href="icon-180.png"><link rel="icon" type="image/png" sizes="32x32" href="icon-32.png"><link rel="icon" type="image/svg+xml" href="icon.svg"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style><title>KardioGo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&display=swap">
<style>
/* Layout: Kitteltaschen-Werkzeug. Sticky Kopf mit Suche/Gewicht, Inhalt als ruhige Liste, feste Tab-Leiste unten.
   Jeder Bereich trägt seine Farbe wie ein Spritzenetikett. */
:root{
  --bg:#f3f5fa; --surface:#ffffff; --sunk:#e9edf5; --fg:#0f1830; --muted:#566382; --line:#d6ddea;
  --accent:#1d4ed8; --on-accent:#ffffff;
  --c-perf:#d0103a; --c-nacht:#3b3fc4; --c-tel:#1d4ed8; --c-sop:#0e6fa8;
  --warn:#b42318; --warn-bg:#fdecee; --hi:#fff1cc; --hi-line:#e3b341; --ok:#1d7a3e;
  --f-body:"Figtree",ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-num:"Figtree",ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:12px; --tab-h:62px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0a0f1e; --surface:#111a2e; --sunk:#18223a; --fg:#e7ecf7; --muted:#95a1bd; --line:#26314c;
  --accent:#7aa5ff; --on-accent:#0a1230;
  --c-perf:#ff6b81; --c-nacht:#a5a9ff; --c-tel:#7aa5ff; --c-sop:#6fc3f2;
  --warn:#ff8b80; --warn-bg:#3b1519; --hi:#3a2f10; --hi-line:#b8902a; --ok:#6fd38f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a0f1e; --surface:#111a2e; --sunk:#18223a; --fg:#e7ecf7; --muted:#95a1bd; --line:#26314c;
  --accent:#7aa5ff; --on-accent:#0a1230;
  --c-perf:#ff6b81; --c-nacht:#a5a9ff; --c-tel:#7aa5ff; --c-sop:#6fc3f2;
  --warn:#ff8b80; --warn-bg:#3b1519; --hi:#3a2f10; --hi-line:#b8902a; --ok:#6fd38f; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font:16px/1.45 var(--f-body);margin:0;-webkit-text-size-adjust:100%;font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1,"zero" 0}
input,button{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1,"zero" 0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Kopf */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;flex-direction:column;gap:8px;padding-block:10px}
.bar{display:flex;align-items:center;gap:10px;min-width:0}
.back{border:0;background:var(--sunk);border-radius:10px;width:40px;height:40px;flex:none;font-size:20px;cursor:pointer}
.ttl{flex:1;min-width:0}
.ttl b{display:block;font-size:19px;line-height:1.2;text-wrap:balance;overflow-wrap:anywhere}
.ttl small{display:block;color:var(--muted);font-size:13px}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:1px;background:var(--sec,var(--accent))}
.kg{display:flex;align-items:center;gap:4px;background:var(--sunk);border-radius:10px;padding:0 8px;height:40px;flex:none}
.kg input{width:52px;border:0;background:transparent;font-family:var(--f-num);font-size:17px;text-align:right;padding:0}
.kg input:focus{outline:none}
.kg span{color:var(--muted);font-size:13px}
.kg:focus-within{outline:2.5px solid var(--accent)}
.search{display:flex;align-items:center;gap:8px;background:var(--sunk);border-radius:10px;padding:0 12px;height:44px}
.search input{flex:1;min-width:0;border:0;background:transparent;font-size:16px;height:100%}
.search input:focus{outline:none}
.search:focus-within{outline:2.5px solid var(--accent)}
.search svg{flex:none;opacity:.6}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;margin:0 -2px}
.chips::-webkit-scrollbar{display:none}
.chips.sub{margin:0}
.chips.sub .chip{font-size:13.5px;padding:5px 11px}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--sec,var(--accent));border-color:transparent;color:var(--bg);font-weight:700}

main{padding-block:14px calc(var(--tab-h) + 28px + env(safe-area-inset-bottom,0px))}
main .wrap{display:flex;flex-direction:column;gap:14px}

/* Tab-Leiste */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:var(--tab-h);text-decoration:none;color:var(--muted);font-size:11.5px;font-weight:700;letter-spacing:.02em}
nav.tabs a svg{width:23px;height:23px}
nav.tabs a[aria-current="page"]{color:var(--sec)}

/* Startseite */
.tiles{display:flex;flex-direction:column;gap:10px}
.tile{display:grid;grid-template-columns:auto 1fr auto;grid-template-rows:auto auto;column-gap:14px;align-items:center;padding:14px 16px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);text-decoration:none;color:var(--fg);position:relative;overflow:hidden}
.tile::before{content:"";position:absolute;inset:0 auto 0 0;width:5px;background:var(--sec)}
.tile svg{width:30px;height:30px;color:var(--sec);grid-row:1/3}
.tile::after{content:"›";grid-column:3;grid-row:1/3;color:var(--muted);font-size:22px}
.tile b{font-size:18px}
.tile small{color:var(--muted);font-size:13px;line-height:1.3;grid-column:2}
h2.sec{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:6px 0 -4px;font-weight:700}

/* Listen */
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:10px;padding:11px 14px;border-top:1px solid var(--line);text-decoration:none;color:var(--fg);min-height:52px}
.row:first-child{border-top:0}
a.row:active{background:var(--sunk)}
.row .main{flex:1;min-width:0}
.row .main b{font-size:16.5px}
.row .main .sub{color:var(--muted);font-size:13.5px;overflow-wrap:anywhere}
.row .rt{flex:none;text-align:right;font-family:var(--f-num);font-size:13.5px;color:var(--sec,var(--accent));white-space:nowrap}
.row .chev{color:var(--muted);flex:none}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 6px;border-radius:5px;background:var(--sunk);color:var(--muted);margin-right:6px;vertical-align:1px}
.empty{padding:22px 14px;color:var(--muted);text-align:center}

/* Perfusor-Detail */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.std{font-family:var(--f-num);font-size:15px;white-space:pre-line}
.conc{color:var(--muted);font-size:13.5px;margin-top:2px}
.seg{display:inline-flex;background:var(--sunk);border-radius:10px;padding:3px;gap:3px;margin-top:8px}
.seg button{border:0;background:transparent;border-radius:8px;padding:6px 10px;font-size:14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.15)}
.calc{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:8px;margin-top:4px}
.calc label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);font-weight:700;letter-spacing:.03em;min-width:0}
.calc input{width:100%;font-family:var(--f-num);font-size:24px;padding:8px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);min-width:0}
.calc input:focus{outline:none;border-color:var(--sec)}
.calc .eq{padding-bottom:12px;color:var(--muted);font-size:20px}
.dl{display:grid;grid-template-columns:auto 1fr auto;gap:0;margin-top:2px}
.dl > div{display:contents}
.dl dt,.dl dd{padding:9px 0;border-top:1px solid var(--line);margin:0}
.dl > div:first-child dt,.dl > div:first-child dd{border-top:0}
.dl dt{color:var(--muted);font-size:13.5px;padding-right:12px;font-weight:700}
.dl dd.v{font-family:var(--f-num);font-size:15px;white-space:pre-line;overflow-wrap:anywhere}
.dl dd.r{font-family:var(--f-num);font-size:15px;text-align:right;color:var(--sec);padding-left:10px;white-space:nowrap;font-weight:600}
.kom{font-size:15.5px}
.need{font-size:13.5px;color:var(--muted);margin-top:8px}
.rate{display:flex;flex-direction:column;gap:10px}
.dlab{font-size:12.5px;font-weight:700;letter-spacing:.03em;color:var(--muted)}
.dlab span{font-family:var(--f-num);font-weight:500}
.drow{display:flex;gap:8px;align-items:stretch}
.drow input{flex:1;min-width:0;font-family:var(--f-num);font-size:26px;padding:8px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg)}
.drow input:focus{outline:none;border-color:var(--sec)}
.stepb{flex:none;width:52px;border-radius:10px;border:1.5px solid var(--line);background:var(--sunk);font-size:26px;cursor:pointer}
.stepb:active{background:var(--line)}
.qchips{display:flex;flex-wrap:wrap;gap:6px}
.qchips button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 9px;font-family:var(--f-num);font-size:14px;cursor:pointer}
.qchips button small{font-family:var(--f-body);color:var(--muted);font-size:12px}
.qchips button[aria-pressed="true"]{border-color:var(--sec);box-shadow:inset 0 0 0 1px var(--sec)}
.big{display:flex;align-items:baseline;gap:8px;padding:12px 14px;border-radius:12px;background:var(--sunk);min-height:76px}
.big .v{font-family:var(--f-num);font-size:46px;font-weight:600;line-height:1;color:var(--sec);font-variant-numeric:tabular-nums}
.big .mlh{font-size:20px;font-weight:700;color:var(--sec)}
.big .mute{color:var(--muted);font-size:17px;align-self:center}
.kg.ask{outline:2.5px solid var(--warn)}
.crow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.crow input{flex:1 1 90px;min-width:0;font-family:var(--f-num);font-size:22px;padding:8px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg)}
.crow select{flex:0 0 auto;font:inherit;font-size:16px;padding:10px 8px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg)}
.crow input:focus,.crow select:focus{outline:none;border-color:var(--sec)}
.crow .in{color:var(--muted);font-size:14px}
.calcchip{text-decoration:none;color:var(--sec);border-color:var(--sec);font-weight:700}
.rev summary{cursor:pointer;color:var(--muted);font-size:14px}
.revrow{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.revrow input{width:110px;font-family:var(--f-num);font-size:18px;padding:6px 8px;border-radius:8px;border:1.5px solid var(--line);background:var(--bg)}
.revrow b{font-family:var(--f-num);color:var(--sec)}
.srcnote{font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.kom13{margin-top:10px;font-size:15px}
.info{margin-top:8px;font-size:13px;line-height:1.4;color:var(--muted)}
.info .tag{font-size:10px;padding:1px 5px;margin-right:6px}
.big .bd{margin-left:auto;font-family:var(--f-num);font-size:14px;color:var(--muted)}
.refs{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.ref{display:grid;grid-template-columns:78px 1fr auto;gap:8px;align-items:baseline;padding:8px 0;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;font:inherit;color:inherit;width:100%}
button.ref{cursor:pointer}
button.ref[aria-pressed="true"] .rl{color:var(--sec)}
.ref .rl{font-size:12.5px;font-weight:700;color:var(--muted)}
.ref .rt2{font-family:var(--f-num);font-size:12.5px;color:var(--muted);white-space:pre-line;overflow-wrap:anywhere;min-width:0}
.ref:not(:has(.ml)) .rt2{font-size:15px;color:var(--fg)}
.ref .ml{font-family:var(--f-num);font-size:18px;color:var(--sec);white-space:nowrap;text-align:right}
.ref .ml small{font-size:12px}
.ref .ml.mute{color:var(--muted);font-size:14px}
.lad{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:6px}
.lad button{display:flex;flex-direction:column;align-items:center;gap:1px;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:6px 4px;cursor:pointer}
.lad button b{font-family:var(--f-num);font-size:16px;color:var(--sec)}
.lad button small{font-family:var(--f-num);font-size:11.5px;color:var(--muted)}
.lad button[aria-pressed="true"]{border-color:var(--sec);box-shadow:inset 0 0 0 1px var(--sec)}
.lad .dots{align-self:center;text-align:center;color:var(--muted)}
.warnbox{margin-top:0}
.formula{margin-top:0;font-family:var(--f-num);font-size:13.5px;color:var(--muted);overflow-wrap:anywhere}
.formula b{color:var(--sec)}
.ph.pg{border-color:var(--c-tel)}
.ph .pgl{font-family:var(--f-body);font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--c-tel)}
mark.w{background:transparent;color:var(--warn);font-weight:700}
.warnbox{background:var(--warn-bg);color:var(--fg);border-radius:10px;padding:10px 12px;font-size:15px}
.warnbox b{color:var(--warn)}

/* Textinhalte (Nachtdienst/SOP) */
.doc{display:flex;flex-direction:column;gap:10px}
.doc h3{font-size:15px;margin:6px 0 -4px;color:var(--sec)}
.doc h3.w{color:var(--warn)}
.doc ul,.doc ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px}
.doc li{padding-left:2px}
.doc li::marker{color:var(--sec)}
.doc ul ul{margin-top:6px;gap:4px;list-style:circle}
.doc p{margin:0}
.ddl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px}
.ddl dt{font-weight:700}
.ddl dd{margin:0}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;font-size:15px;min-width:240px}
.tbl th,.tbl td{text-align:left;padding:7px 14px 7px 0;border-bottom:1px solid var(--line);white-space:pre-line;vertical-align:top}
.tbl th{font-size:12.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.ttabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.ttabs::-webkit-scrollbar{display:none}
.ttabs button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 13px;font-size:14.5px;cursor:pointer;white-space:nowrap}
.ttabs button[aria-pressed="true"]{background:var(--sec);color:var(--bg);border-color:transparent;font-weight:700}
.ttabs button.w:not([aria-pressed="true"]){color:var(--warn);border-color:var(--warn)}
.xref{display:inline-flex;align-items:center;gap:6px;font-size:14px;text-decoration:none;color:var(--sec);border:1px dashed var(--sec);border-radius:8px;padding:6px 10px;align-self:flex-start}

/* Werkzeuge */
.tool{background:var(--sunk);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px}
.tool .in{display:flex;gap:8px;flex-wrap:wrap;align-items:end}
.tool label{display:flex;flex-direction:column;gap:3px;font-size:12.5px;font-weight:700;color:var(--muted)}
.tool input{width:96px;font-family:var(--f-num);font-size:20px;padding:6px 8px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface)}
.tool input:focus{outline:none;border-color:var(--sec)}
.tool .res{font-family:var(--f-num);font-size:20px;font-weight:600;color:var(--sec)}
.tool .res small{font-family:var(--f-body);font-size:13px;color:var(--muted);font-weight:400}
.steps{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:6px}
.steps li{display:flex;gap:10px;padding:8px 10px;border-radius:9px;background:var(--surface);border:1px solid var(--line)}
.steps li .n{flex:none;font-family:var(--f-num);font-weight:600;width:20px;color:var(--muted)}
.steps li.on{background:var(--hi);border-color:var(--hi-line)}
.steps li.on .n{color:var(--fg)}

/* Telefon */
.ph{display:inline-flex;align-items:center;gap:4px;font-family:var(--f-num);font-weight:600;font-size:15px;border:1px solid var(--line);background:var(--sunk);color:var(--fg);border-radius:8px;padding:4px 8px;cursor:pointer;white-space:nowrap;vertical-align:baseline;line-height:1.25}
.ph small{font-family:var(--f-body);font-weight:400;font-size:11.5px;color:var(--muted)}
.ph:active{background:var(--line)}
.doc .ph{font-size:14px;padding:1px 6px}
.trow{display:flex;gap:10px;padding:10px 14px;border-top:1px solid var(--line);align-items:flex-start}
.trow:first-child{border-top:0}
.trow .main{flex:1;min-width:0}
.trow .main b{font-weight:700;overflow-wrap:anywhere}
.trow .note{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.trow .nums{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.star{border:0;background:transparent;font-size:20px;line-height:1;cursor:pointer;color:var(--line);padding:2px;flex:none}
.star[aria-pressed="true"]{color:var(--hi-line)}
.dhead{padding:8px 14px;background:var(--sunk);font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.callx{font-size:12px;margin-left:2px}

.pdf{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--muted);text-decoration:none;border:1px solid var(--line);border-radius:8px;padding:6px 10px;align-self:flex-start;background:var(--surface)}
.stand{color:var(--muted);font-size:13px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tab-h) + 16px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:14.5px;z-index:40;opacity:0;transition:opacity .15s;pointer-events:none}
.toast.on{opacity:1}
.hint{color:var(--muted);font-size:13px;text-align:center}
.logo{width:40px;height:40px;border-radius:10px;flex:none}
.themebtn{border:0;background:var(--sunk);border-radius:10px;width:40px;height:40px;flex:none;cursor:pointer}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}

</style>

<header class="top" id="top"></header>
<main id="main"><div class="wrap" id="view"></div></main>
<nav class="tabs" aria-label="Bereiche"><div class="in" id="tabs"></div></nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
// Perfusorstandard Intensivstation 13H3 (Version 2.0, 09.09.2019) – Text wörtlich aus der Quelle.
// calc: c = Konzentration (Einheit der Dosis pro ml), w = gewichtsbezogen, m = 60 bei "/min"
// s = Startdosis [von,bis], st = Steigerungsschritt, mx = Max-Dosis, lv = zusätzliche Dosisstufen aus der Quelle
// g = App-Filter (Navigationshilfe, nicht Teil der Quelle)
const PERF = {
  meta: { title: "Perfusorstandard 13H3", version: "Version 2.0 · 09.09.2019", pdf: "pdfs/perfusorstandard-13h3.pdf" },

        { ul: ["Driveline oder Anschlüsse beschädigt → VADK umgehend verständigen.", "Sturz des Systemcontrollers → VADK umgehend verständigen.", "Veränderungen der Pumpenfunktion (Stromaufnahme, Pumpenindex, etc.), Geräusche → Ärztin/Arzt 13H3.", "Smartphones, Tablets, Computer: Mindestabstand 10cm zum Systemcontroller.", "Keine Magnetresonanz Tomographie und Stoßwellentherapie möglich.", "Therapeutische Ultraschallenergiepegel meiden.", "Keine Verfahren mit Hochspannungsgeräten (z.B. Diathermie).", "Keine Mehrfachsteckdosen verwenden.", "Gerinnungsmanagement: partielle Thromboplastinzeit, Thrombinzeit, Hämatokrit, freies Hämoglobin und Lactatdehydrogenase (Thrombenbildung).", "Thoraxdrainagen nach AAO ehest möglich entfernen.", "Bei Schrittmacherimplantationen kann es nötig sein, das VAD intraoperativ mit Akkus zu versorgen.", "Driveline-Verband: keine Lösungsmittel, Desinfektionsmittel, Wundbenzin, Salben (Kortison, Antimycotika, Jod oder Antibiotika).", "Weitere Informationen: AKH Netzlaufwerk J:/Kunstherz"] },

        { h: "Abschalten HeartWare® HVAD" },
        { p: "Weiße Driveline Abdeckung entfernen. Driveline Sicherungsring aufschrauben und die Driveline vom Systemcontroller abziehen. Am Bildschirm des Systemcontrollers erscheint „VAD gestoppt“. Es ertönt nach 10 Sekunden ein akustischer und optischer Alarm. Der Controller kann nun mittels drücken und halten der „Stummschaltetaste“ und der Bildlauftaste (⇑) solange bis ein Piepton ertönt ausgeschalten werden. Beide Stromquellen vom Systemcontroller trennen. Die Steuereinheit ist nun abgeschaltet. Das VAD kann auch über den Systemmonitor abgeschaltet werden. Passwort: 68773" },
        { h: "Abschalten HeartMate III®" },
        { p: "Driveline Sicherungslasche an der Rückseite des Systemcontrollers entriegeln. Driveline vom Systemcontroller abziehen. Am Display erscheint „Steuerleitung anschließen“. Das sonst grüne Pumpensymbol erlischt und es ertönt ein Alarmton. Nun beide Stromversorgunsquellen entfernen. Das Gerät wird jetzt vom integrierten 11V-Lithiumionen-Akku betrieben. Durch Drücken der Anzeigetaste wird der Systemcontroller in den Standby-Modus versetzt." }

function wireTools(root){
  root.querySelectorAll("input[data-kg]").forEach(i=>i.addEventListener("input",()=>{const v=parseNum(i.value);setKg(v>0?v:null);syncKg(i);}));
  const k=root.querySelector("#t-k");
  if(k){const upd=()=>{const K=parseNum(k.value),W=parseNum(root.querySelector("#t-kg").value);const o=root.querySelector("#t-out");
    if(isFinite(K)&&isFinite(W)&&W>0){const d=(4.5-K)*W*0.4;o.innerHTML=fmt(d,0)+' mVal <small>Kaliumdefizit = (4.5 – '+fmt(K,2)+') × '+fmt(W,1)+' × 0.4</small>';}else o.textContent="–";};
    k.addEventListener("input",upd);root.querySelector("#t-kg").addEventListener("input",upd);upd();}
  const hk=root.querySelector("#t-hk");
  if(hk){let ekg=null;const upd=()=>{const K=parseNum(hk.value);root.querySelectorAll("#t-steps li").forEach(li=>{const s=NACHT.hyperkSteps[li.dataset.n-1];let on=false;
      if(isFinite(K)&&K>=5.5){ if(s.k==="all")on=true; else if(s.hi!=null)on=K>=s.lo&&K<=s.hi&&(s.n!==2||K<6.0)&&(s.n!==3||K>=6.0); else if(K>=s.lo)on=s.ekg==null?true:(ekg===null?true:s.ekg===ekg); }
      li.classList.toggle("on",on);});};
    hk.addEventListener("input",upd);
    root.querySelectorAll("[data-ekg]").forEach(b=>b.addEventListener("click",()=>{const v=+b.dataset.ekg;ekg=ekg===v?null:v;root.querySelectorAll("[data-ekg]").forEach(x=>x.setAttribute("aria-pressed",String(ekg===+x.dataset.ekg)));upd();}));}
  const ik=root.querySelector("#t-ikg");
  if(ik){const upd=()=>{const W=parseNum(ik.value);const o=root.querySelector("#t-iout");
    if(isFinite(W)&&W>0){const mg=Math.min(W,100);o.innerHTML=fmt(mg,1)+' mg 1-0-1 s.c. <small>therapeutisch '+(W>100?'(Maximum 100 mg)':'1 mg/kg')+'</small>';}else o.textContent="–";};
    ik.addEventListener("input",upd);upd();}
}

let GIDX=null;
function buildIndex(){
  const ix=[];
  PERF.drugs.forEach(d=>ix.push({k:"perf",t:d.n+(d.sub?" ("+d.sub+")":""),s:d.std.replace(/\n/g," / "),h:"#p-"+d.id,x:norm([d.n,d.sub,d.std,d.k,d.dose].join(" "))}));
  Object.entries(NACHT.topics).forEach(([id,tp])=>ix.push({k:"nacht",t:tp.t,s:"Nachtdiensthilfe",h:"#n-"+id,x:norm(tp.t+" "+JSON.stringify(tp.blocks)+" "+JSON.stringify(tp.tabs||""))}));
  SOP.items.forEach(s=>ix.push({k:"sop",t:s.t,s:"SOP · "+s.stand,h:"#s-"+s.id,x:norm(s.t+" "+JSON.stringify(s.tabs))}));
  SOP.forms.forEach(f=>ix.push({k:"sop",t:f.t,s:"Formular",h:"#f-"+f.id,x:norm(f.t+" "+f.info.join(" "))}));
  PHONES.entries.forEach((e,i)=>ix.push({k:"tel",t:e.n,s:e.s,h:null,e:i,x:norm(e.c+" "+e.s+" "+e.n+" "+(e.a||"")+" "+e.note+" "+e.nums.map(n=>n.v.replace(/[\s-]/g,"")+" "+n.v+" "+(n.l||"")).join(" "))}));
  return ix;
}
function globalSearch(q){
  const r=$("#res"); const terms=norm(q).split(/\s+/).filter(Boolean);
  if(!terms.length){r.innerHTML="";return;}
  GIDX=GIDX||buildIndex();
  const hits=GIDX.filter(i=>terms.every(t=>i.x.includes(t)||norm(i.t).includes(t)));
  hits.sort((a,b)=>score(b,terms)-score(a,terms));
  const top=hits.slice(0,40);
  r.innerHTML=top.length?'<div class="list">'+top.map(i=>i.k==="tel"?telRow(PHONES.entries[i.e],true):'<a class="row" href="'+i.h+'" style="--sec:'+SEC[i.k].c+'"><span class="tag">'+SEC[i.k].t+'</span><div class="main"><b>'+esc(i.t)+'</b><div class="sub">'+esc(i.s)+'</div></div><span class="chev">›</span></a>').join("")+'</div>':'<div class="list"><div class="empty">Keine Treffer.</div></div>';
  wireTel(r);
}
function score(i,terms){const t=norm(i.t);let s=0;terms.forEach(x=>{if(t.startsWith(x))s+=3;else if(t.includes(x))s+=2;});return s;}

const CALC_MEM={};
const isG=u=>/^[µμ]g\/kg\/min$/.test(u);
const dU=(d,v)=>fmt(v,3)+(isG(d.u)?" γ":" "+d.u);
function ladder(c){ // Start + n × Schritt (bis Max, sonst 3 Schritte); max. 8 Werte
  if(c.dbl&&c.s){const o=[];for(let v=c.s[0];v<=c.mx+1e-9;v*=2)o.push(v);return o;}
  if(!c.s||!c.st)return [];
  const out=[]; const lim=c.mx!=null?c.mx:c.s[0]+3*c.st;
  for(let v=c.s[0],i=0;v<=lim+1e-9&&i<60;i++,v=Math.round((v+c.st)*1e6)/1e6)out.push(v);
  if(c.mx!=null&&Math.abs(out[out.length-1]-c.mx)>1e-9)out.push(c.mx);
  if(out.length>8)return out.slice(0,7).concat([null,out[out.length-1]]);
  return out;
}
function drawDetail(d){
  const kg=getKg(); const c=calcOf(d); const el=$("#pd"); if(!el)return;
  const info=(typeof PERF_INFO!=="undefined")&&PERF_INFO[d.id];
  let h='<div class="card">'+(d.src?'<div class="srcnote">'+esc(d.src)+' · nicht im 13H3-Standard</div>':'')+'<div class="std">'+esc(d.std||"—")+'</div>';
  if(c){ if(c.co) h+='<div class="seg" role="group" aria-label="Konzentration">'+c.co.map((o,i)=>'<button type="button" data-co="'+i+'" aria-pressed="'+(o[1]===c.cc)+'">'+esc(o[0])+'</button>').join("")+'</div>';
    h+='<div class="conc">= '+fmt(c.cc,4)+' '+esc(c.cu)+'</div>'; }
  if(d.k) h+='<div class="kom13">'+rich(d.k)+'</div>';
  if(info) h+='<div class="info"><span class="tag">Info</span>'+rich(info)+'</div>';
  h+='</div>';
  const R=v=>c?rateRange(c,Array.isArray(v)?v:[v],kg):"";
  const mlh=s=>s?'<b class="ml">'+esc(s)+'<small> ml/h</small></b>':(c&&c.w&&!kg?'<b class="ml mute">kg?</b>':'');
  // Referenzzeilen: Text aus dem Standard klein, ml/h groß
  const rows=[];
  if(d.dose!=null) rows.push({l:"Dosis",t:d.dose,u:d.u});
  if(d.dose==null&&d.start) rows.push({l:"Start",t:d.start,u:d.u,r:c&&c.s?R(c.s):"",q:c&&c.s?c.s[0]:null});
  if(d.dose!=null&&c&&c.s) rows.push({l:c.sl||"Start",t:c.s.map(x=>fmt(x,3)).join("–"),u:d.u,r:R(c.s),q:c.s[0]});
  if(c&&c.st) rows.push({l:"Schritt",t:"+"+(d.step&&d.dose==null?d.step:fmt(c.st,3)),u:d.u,r:"+"+R(c.st)});
  else if(d.step) rows.push({l:"Steigerung",t:d.step,u:d.u});
  if(c&&c.lv) c.lv.forEach(x=>rows.push({l:x[0],t:fmt(x[1],3),u:d.u,r:R(x[1]),q:x[1]}));
  if(d.max) rows.push({l:"Max.",t:d.max,u:d.u,r:c&&c.mx!=null?R(c.mx):"",q:c&&c.mx!=null?c.mx:null,w:1});
  const unitTxt=u=>u?(isG(u)?" γ":" "+u):"";
  const rowsH='<div class="refs">'+rows.map(r=>'<'+(r.q!=null?'button type="button" data-q="'+r.q+'"':'div')+' class="ref'+(r.w?' mx':'')+'"><span class="rl">'+esc(r.l)+'</span><span class="rt2">'+rich(r.t)+(r.l!=="Dosis"&&/[\d)]$/.test(r.t.trim())?esc(unitTxt(r.u)):'')+'</span>'+mlh(r.r)+'</'+(r.q!=null?'button':'div')+'>').join("")+'</div>';
  if(c){
    const lad=ladder(c);
    h+='<div class="card rate"><label class="dlab" for="cd">Dosis <span>'+(isG(d.u)?'γ = µg/kg/min':esc(d.u))+'</span></label><div class="drow">'+
      (c.st?'<button type="button" class="stepb" data-step="-1" aria-label="einen Schritt runter">−</button>':'')+
      '<input id="cd" inputmode="decimal" autocomplete="off">'+
      (c.st?'<button type="button" class="stepb" data-step="1" aria-label="einen Schritt rauf">+</button>':'')+'</div>'+
      '<div class="big" id="cbig" aria-live="polite"></div><div id="cmsg"></div>'+rowsH+
      (lad.length?'<div class="dlab">Titration</div><div class="lad">'+lad.map(v=>v==null?'<span class="dots">…</span>':'<button type="button" data-q="'+v+'"><b>'+(R(v)||'kg?')+'</b><small>'+esc(dU(d,v))+'</small></button>').join("")+'</div>':'')+
      '<details class="rev"><summary>Umgekehrt: ml/h → Dosis</summary><div class="revrow"><input id="cr" inputmode="decimal" autocomplete="off" aria-label="ml/h"><span>ml/h =</span><b id="crd">–</b></div></details></div>';
  } else {
    h+='<div class="card">'+rowsH+'</div>';
  }
  if(d.bolus){ h+='<div class="card"><div class="dlab">Initialdosis 90 µg/kg</div><div class="big"><span class="v" style="font-size:34px">'+(kg?fmt(d.bolus.perKg*kg/1000,2):'–')+'</span><span class="mlh">mg</span></div>'+(kg?'<div class="formula">90 µg × '+fmt(kg,1)+' kg = '+fmt(d.bolus.perKg*kg,0)+' µg</div>':'<div class="need">Gewicht oben eingeben.</div>')+'</div>'; }
  el.innerHTML=h;
  el.querySelectorAll("[data-co]").forEach(b=>b.addEventListener("click",()=>{store.set("conc."+d.id,+b.dataset.co);drawDetail(d);}));
  if(c){ const cd=$("#cd"),cr=$("#cr"),big=$("#cbig"),msg=$("#cmsg"),crd=$("#crd");
    const upd=()=>{
      const kg=getKg(); const dose=parseNum(cd.value); let m="";
      CALC_MEM[d.id]=cd.value;
      el.querySelectorAll("[data-q]").forEach(b=>b.setAttribute("aria-pressed",String(isFinite(dose)&&Math.abs(+b.dataset.q-dose)<1e-9)));
      if(c.w&&!kg){ big.innerHTML='<span class="mute">Gewicht oben eingeben</span>'; document.querySelector("#top .kg")?.classList.add("ask"); }
      else if(!(dose>=0)){ big.innerHTML='<span class="mute">Dosis eingeben</span>'; }
      else { document.querySelector("#top .kg")?.classList.remove("ask");
        const rate=toRate(c,dose,kg);
        big.innerHTML='<span class="v">'+fmt(rate)+'</span><span class="mlh">ml/h</span><span class="bd">'+esc(dU(d,dose))+'</span>';
        m+='<div class="formula">'+fmt(dose,3)+' '+esc(d.u)+(c.w?' × '+fmt(kg,1)+' kg':'')+(c.m===60?' × 60':'')+' ÷ '+fmt(c.cc,4)+' '+esc(c.cu)+'</div>';
        if(c.mx!=null&&dose>c.mx+1e-9) m+='<div class="warnbox"><b>Über Max.-Dosis</b> laut Standard: '+esc(dU(d,c.mx))+' = '+rateRange(c,[c.mx],kg)+' ml/h</div>';
      }
      if(c.w&&kg&&(kg<30||kg>250)) m+='<div class="warnbox"><b>Gewicht prüfen:</b> '+fmt(kg,1)+' kg</div>';
      msg.innerHTML=m;
      const r=parseNum(cr.value); const x=r>=0?toDose(c,r,kg):NaN; crd.textContent=isFinite(x)?dU(d,x):"–";
    };
    cd.addEventListener("input",upd); cr.addEventListener("input",upd);
    el.querySelectorAll("[data-q]").forEach(b=>b.addEventListener("click",()=>{cd.value=fmt(+b.dataset.q,3);upd();}));
    el.querySelectorAll("[data-step]").forEach(b=>b.addEventListener("click",()=>{const v=parseNum(cd.value);const n=Math.max(0,Math.round(((isFinite(v)?v:0)+(+b.dataset.step)*c.st)*1e6)/1e6);cd.value=fmt(n,3);upd();}));
    cd.value=CALC_MEM[d.id]!=null?CALC_MEM[d.id]:(c.s?fmt(c.s[0],3):""); upd(); }
}

// Freier Perfusor-Rechner (beliebige Substanz)
const AMT_U={"g":["m",1e9],"mg":["m",1e6],"µg":["m",1e3],"ng":["m",1],"IE":["ie",1],"mmol":["mol",1]};
const DOSE_U=[["µg/kg/min","µg",1,60],["µg/kg/h","µg",1,1],["mg/kg/h","mg",1,1],["mg/kg/min","mg",1,60],["ng/kg/min","ng",1,60],
  ["mg/h","mg",0,1],["µg/h","µg",0,1],["µg/min","µg",0,60],["mg/min","mg",0,60],["g/h","g",0,1],
  ["IE/h","IE",0,1],["IE/kg/h","IE",1,1],["mmol/h","mmol",0,1],["ml/h","ml",0,1]];
function viewCalc(){
  setSec("perf");tabs("perf");
  const st=store.get("calc",{a:"",au:"mg",v:"50",du:"µg/kg/min",d:""});
  header({t:"Perfusor-Rechner",sub:"für jede Substanz",back:"perfusor",kg:1,onKg:()=>upd()});
  const opt=(arr,sel)=>arr.map(x=>'<option'+(x===sel?' selected':'')+'>'+x+'</option>').join("");
  show('<div class="card rate">'+
    '<div class="dlab">Spritze</div><div class="crow"><input id="ga" inputmode="decimal" placeholder="Menge" value="'+esc(st.a)+'" aria-label="Wirkstoffmenge"><select id="gau" aria-label="Einheit">'+opt(Object.keys(AMT_U),st.au)+'</select><span class="in">in</span><input id="gv" inputmode="decimal" value="'+esc(st.v)+'" aria-label="Volumen ml"><span class="in">ml</span></div>'+
    '<div class="conc" id="gc"></div>'+
    '<div class="dlab">Dosis</div><div class="crow"><input id="gd" inputmode="decimal" placeholder="Dosis" value="'+esc(st.d)+'" aria-label="Dosis"><select id="gdu" aria-label="Dosiseinheit">'+opt(DOSE_U.map(x=>x[0]).filter(x=>x!=="ml/h"),st.du)+'</select></div>'+
    '<div class="big" id="gbig" aria-live="polite"></div><div id="gmsg"></div>'+
    '<details class="rev"><summary>Umgekehrt: ml/h → Dosis</summary><div class="revrow"><input id="gr" inputmode="decimal" aria-label="ml/h"><span>ml/h =</span><b id="grd">–</b></div></details>'+
    '</div><p class="hint">Nur Rechenhilfe – Konzentration und Dosis selbst prüfen.</p>');
  const $a=$("#ga"),$au=$("#gau"),$v=$("#gv"),$d=$("#gd"),$du=$("#gdu"),$r=$("#gr");
  [$a,$au,$v,$d,$du,$r].forEach(x=>x.addEventListener("input",upd));
  function upd(){
    const s={a:$a.value,au:$au.value,v:$v.value,du:$du.value,d:$d.value}; store.set("calc",s);
    const a=parseNum(s.a),v=parseNum(s.v),d=parseNum(s.d),kg=getKg();
    const A=AMT_U[s.au]; const U=DOSE_U.find(x=>x[0]===s.du); const DU=AMT_U[U[1]];
    const big=$("#gbig"),msg=$("#gmsg"),gc=$("#gc"),grd=$("#grd"); let m="";
    if(!(a>0&&v>0)){gc.textContent="";big.innerHTML='<span class="mute">Menge und Volumen eingeben</span>';msg.innerHTML="";grd.textContent="–";return;}
    gc.textContent="= "+fmt(a/v,4)+" "+s.au+"/ml";
    if(A[0]!==DU[0]){big.innerHTML='<span class="mute">Einheiten passen nicht ('+esc(s.au)+' ↔ '+esc(s.du)+')</span>';msg.innerHTML="";grd.textContent="–";return;}
    const cc=a*A[1]/v/DU[1]; // Konzentration in Dosis-Einheit pro ml
    const c={cc:cc,w:U[2],m:U[3]};
    if(c.w&&!kg){big.innerHTML='<span class="mute">Gewicht oben eingeben</span>';document.querySelector("#top .kg")?.classList.add("ask");}
    else if(!(d>=0)){big.innerHTML='<span class="mute">Dosis eingeben</span>';}
    else{document.querySelector("#top .kg")?.classList.remove("ask");
      const r=toRate(c,d,kg);
      big.innerHTML='<span class="v">'+fmt(r)+'</span><span class="mlh">ml/h</span><span class="bd">'+fmt(d,3)+' '+esc(s.du)+'</span>';
      m+='<div class="formula">'+fmt(d,3)+' '+esc(s.du)+(c.w?' × '+fmt(kg,1)+' kg':'')+(c.m===60?' × 60':'')+' ÷ '+fmt(cc,4)+' '+esc(U[1])+'/ml</div>';
      if(r>0) m+='<div class="formula">Spritze ('+fmt(v,1)+' ml) reicht ca. <b>'+fmt(v/r,1)+' h</b> · Tagesmenge '+fmt(d*(c.w?kg:1)*c.m*24,2)+' '+esc(U[1])+'</div>';
    }
    if(c.w&&kg&&(kg<30||kg>250)) m+='<div class="warnbox"><b>Gewicht prüfen:</b> '+fmt(kg,1)+' kg</div>';
    msg.innerHTML=m;
    const rr=parseNum($r.value); const x=rr>=0?toDose(c,rr,kg):NaN; grd.textContent=isFinite(x)?fmt(x,3)+" "+s.du:"–";
  }
  upd();
}

// Telefon
const CAT_ORDER=["Kardiologie","Konsile & Dienste","Intensiv & Notfall","Radiologie & Nuklear","Labor & Blut","Hämato & Onko","Innere Medizin","Chirurgie & OP","Neuro & Psych","Weitere Fächer","Stationen AKH","Verwaltung & Sonstiges"];
const SUB_ORDER={"Kardiologie":["Dienste & Pager","Herzkatheter","Stationen","Ambulanzen","Ärzt:innen","Forschung","Sekretariat & Leitung"]};
let telQ="", telCat=store.get("telcat","Kardiologie"), telSub="";
function favSet(){return new Set(store.get("favs2",[]))}
function favKey(e){return e.c+"|"+e.s+"|"+e.n}
function favEntries(){const f=favSet();return PHONES.entries.filter(e=>f.has(favKey(e)));}
function telRow(e,ctx){
  const fav=favSet().has(favKey(e));
  return '<div class="trow"><button class="star" type="button" data-fav="'+esc(favKey(e))+'" aria-pressed="'+fav+'" aria-label="Favorit">★</button><div class="main"><b>'+esc(e.n)+'</b>'+(ctx?' <span class="note">· '+esc(e.s)+'</span>':'')+
    (e.a?'<div class="note">auch: '+esc(e.a)+'</div>':'')+(e.note?'<div class="note">'+richNotes(e.note)+'</div>':'')+(e.nums.length?'<div class="nums">'+e.nums.map(n=>phoneBtn(n.v,n.l)).join("")+'</div>':'')+'</div></div>';
}
function subsOf(c){const s=[...new Set(PHONES.entries.filter(e=>e.c===c).map(e=>e.s))];const o=SUB_ORDER[c]||[];return s.sort((x,y)=>{const i=o.indexOf(x),j=o.indexOf(y);return (i<0?99:i)-(j<0?99:j)||x.localeCompare(y,"de");});}
function viewTel(){
  setSec("tel");tabs("tel");
  const cats=CAT_ORDER.filter(c=>PHONES.entries.some(e=>e.c===c));
  if(telCat!=="★"&&!cats.includes(telCat))telCat=cats[0];
  const chips='<div class="chips" role="group" aria-label="Kategorie"><button class="chip" type="button" data-c="★" aria-pressed="'+(telCat==="★")+'">★</button>'+cats.map(c=>'<button class="chip" type="button" data-c="'+esc(c)+'" aria-pressed="'+(telCat===c)+'">'+esc(c)+'</button>').join("")+'</div>';
  header({t:"Telefon & Pager",sub:"Suche durchsucht alle Kategorien",search:"Name, Stelle oder Nummer …",q:telQ,chips});
  show('<div class="chips sub" id="subs" role="group" aria-label="Unterkategorie"></div><div id="tl"></div><p class="hint">Nummer antippen = kopieren</p>');
  $("#q").addEventListener("input",e=>{telQ=e.target.value;drawTel();});
  document.querySelectorAll(".chip[data-c]").forEach(c=>c.addEventListener("click",()=>{telCat=c.dataset.c;telSub="";store.set("telcat",telCat);telQ="";const q=$("#q");if(q)q.value="";document.querySelectorAll(".chip[data-c]").forEach(x=>x.setAttribute("aria-pressed",String(x===c)));drawTel();}));
  drawTel();
}
function drawTel(){
  const el=$("#tl"),sb=$("#subs"); if(!el)return; const terms=norm(telQ).split(/\s+/).filter(Boolean); const f=favSet();
  const hay=e=>norm(e.c+" "+e.s+" "+e.n+" "+(e.a||"")+" "+e.note+" "+e.nums.map(n=>n.v.replace(/[\s-]/g,"")+" "+n.v+" "+(n.l||"")).join(" "));
  let list, grp;
  if(terms.length){ // Suche: immer über alle Kategorien
    sb.hidden=true;
    list=PHONES.entries.filter(e=>terms.every(t=>hay(e).includes(t)));
    grp=e=>e.c+" · "+e.s;
  } else if(telCat==="★"){
    sb.hidden=true; list=PHONES.entries.filter(e=>f.has(favKey(e))); grp=e=>e.c;
  } else {
    const subs=subsOf(telCat);
    if(telSub&&!subs.includes(telSub))telSub="";
    sb.hidden=subs.length<2;
    sb.innerHTML='<button class="chip" type="button" data-s="" aria-pressed="'+(telSub==="")+'">Alle</button>'+subs.map(s=>'<button class="chip" type="button" data-s="'+esc(s)+'" aria-pressed="'+(telSub===s)+'">'+esc(s)+'</button>').join("");
    sb.querySelectorAll("[data-s]").forEach(b=>b.addEventListener("click",()=>{telSub=b.dataset.s;drawTel();}));
    list=PHONES.entries.filter(e=>e.c===telCat&&(!telSub||e.s===telSub)); grp=e=>e.s;
  }
  if(!list.length){el.innerHTML='<div class="list"><div class="empty">'+(telCat==="★"&&!terms.length?"Noch keine Favoriten. Stern antippen zum Merken.":"Keine Nummer gefunden.")+'</div></div>';return;}
  const by=new Map(); list.forEach(e=>{const k=grp(e);if(!by.has(k))by.set(k,[]);by.get(k).push(e);});
  const keys=[...by.keys()]; if(!terms.length&&telCat!=="★"){const o=subsOf(telCat);keys.sort((a,b)=>o.indexOf(a)-o.indexOf(b));}
  el.innerHTML='<div class="list">'+keys.map(k=>'<div class="dhead">'+esc(k)+'</div>'+by.get(k).sort((a,b)=>a.n.localeCompare(b.n,"de")).map(e=>telRow(e,false)).join("")).join("")+'</div>';
  wireTel(el);
}
function wireTel(root){
  root.querySelectorAll("[data-fav]").forEach(b=>b.onclick=()=>{const f=favSet();const k=b.dataset.fav;f.has(k)?f.delete(k):f.add(k);store.set("favs",[...f]);b.setAttribute("aria-pressed",String(f.has(k)));toast(f.has(k)?"Als Favorit gemerkt":"Favorit entfernt");});
}

      (fo.length?'<h2 class="sec">Formulare & Zuweisungen</h2><div class="list">'+fo.map(f=>'<a class="row" href="#f-'+f.id+'"><div class="main"><b>'+esc(f.t)+'</b></div><span class="chev">›</span></a>').join("")+'</div>':'')+

function viewSop(id){

  setSec("sop");tabs("sop");
  header({t:s.t,sub:s.stand,back:"sop"});
  const start=Math.min(store.get("soptab."+id,0),s.tabs.length-1);
  show('<div class="ttabs" role="tablist">'+s.tabs.map((t,i)=>'<button type="button" role="tab" data-tab="'+i+'" aria-pressed="'+(i===start)+'">'+esc(t.t)+'</button>').join("")+'</div><div class="card doc" id="tabc">'+renderBlocks(s.tabs[start].blocks)+'</div>'+'');
  wireTools(V);wireTel(V);
  V.querySelectorAll("[data-tab]").forEach(b=>b.addEventListener("click",()=>{V.querySelectorAll("[data-tab]").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));store.set("soptab."+id,+b.dataset.tab);const c=$("#tabc");c.innerHTML=renderBlocks(s.tabs[+b.dataset.tab].blocks);wireTools(c);wireTel(c);}));
}
function viewForm(id){
  const f=SOP.forms.find(x=>x.id===id); if(!f)return viewSopList();
  setSec("sop");tabs("sop");
  header({t:f.t,sub:"Formular",back:"sop"});
  show('<div class="card doc"><ul>'+f.info.map(i=>'<li>'+rich(i)+'</li>').join("")+'</ul></div>');
}

/* ---------- Kopieren ---------- */
let tt;
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("on"),1400);}
document.addEventListener("click",e=>{const b=e.target.closest("[data-copy]");if(!b)return;const v=b.dataset.copy;
  const ok=()=>toast(v+" kopiert");
  try{navigator.clipboard.writeText(v).then(ok,()=>{fallback(b);});}catch(err){fallback(b);}
  function fallback(el){const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r);toast(v);}
});

/* ---------- Routing (#start, #perfusor, #p-id, #nacht, #n-id, #tel, #sop, #s-id, #f-id) ---------- */
function go(){
  const h=decodeURIComponent(location.hash.slice(1));
  if(h==="perfusor")return viewPerfList();
  if(h==="rechner")return viewCalc();
  if(h.startsWith("p-"))return viewPerfDetail(h.slice(2));
  if(h==="nacht")return viewNachtList();
  if(h.startsWith("n-"))return viewNachtTopic(h.slice(2));
  if(h==="tel")return viewTel();
  if(h==="sop")return viewSopList();
  if(h.startsWith("s-"))return viewSop(h.slice(2));
  if(h.startsWith("f-"))return viewForm(h.slice(2));
  return viewHome();
}
document.addEventListener("click",e=>{const a=e.target.closest('a[href^="#"]');if(a)navStack++;});
window.addEventListener("hashchange",go);
const th=store.get("theme",null); if(th)document.documentElement.dataset.theme=th;
try{ if(typeof PERF==="undefined"||typeof PHONES==="undefined") throw 0; go(); }
catch(e){ V.innerHTML='<div class="card">Daten konnten nicht geladen werden.</div>'; }
try{ if("serviceWorker" in navigator && location.protocol==="https:" && window.self===window.top && document.querySelector('link[rel="manifest"]')) navigator.serviceWorker.register("sw.js").catch(()=>{}); }catch(e){}
})();
