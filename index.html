ningitis tuberculosa"}, {"text": "Rücksprache Infektionsdienst", "colspan": 4}]}]}, {"type": "footnotes", "items": [{"marker": "④", "text": "Cave hohe Natriumbelastung: 14 mmol pro 1g Fosfomycin, regelmäßiges Monitoring von Volumenstatus, Na + und K+ empfohlen!"}, {"marker": "⑤", "text": "Bei Fremdmaterial: Rücksprache Neurochirurgie"}, {"marker": "⑥", "text": "TDM: Talspiegelmessung < 1mg/L"}, {"marker": "⑦", "text": "Nach Antibiogramm aber KEIN Piperacillin/Tazobactam bzw. Ceftolozan/Tazobactam: Betalaktamasehemmer erreichen unzureichende Konzentration im Liquor!"}]}]}]}, {"id": "kap03", "chapter": "03", "title": "Hirnabszess", "sections": [{"id": "kap03-diagnostik", "number": null, "title": "Diagnostische Empfehlungen/ Erforderliche Diagnostik", "blocks": [{"type": "bullets", "items": ["Die entscheidende radiologisch-diagnostische Maßnahme ist das kraniale MRT (bzw. das cCT, wenn ein cMRT nicht möglich ist). Das cCT ist allein nicht ausreichend einen Hirnabszess zu diagnostizieren bzw. auszuschließen!", "Häufig polymikrobielle Ursache (Streptokokken, S. aureus, Anaerobier, Enterobacterales). Für die Erregeridentifikation entscheidend sind die rasche Gewinnung (optimal vor Antibiotikagabe) von:", "Zur erfolgreichen Kultur von Anaerobiern muss der Kontakt des Probenmaterials mit der Luft vermieden werden. Am besten Eiter mit einer Spritze ohne Luftbeimengung aspirieren und Spritze danach luftdicht verschlossen einschicken.", "Das Abszessmaterial soll sofort mikroskopisch untersucht und kultiviert werden➔ Gramfärbung+Kultur auf Bakterien+Pilze anforden.", "Zusätzlich, um möglichst alle beteiligten Erreger zu identifizieren, sollten darüber hinaus je 10 ml Abszessaspirat sofort in eine aerobe und eine anaerobe Blutkulturflasche gefüllt werden.", "Zusätzlich zur Kultur soll das Abszessmaterial mittels bakterielle 16S Breitspektrum-PCR untersucht werden oder bei Verdacht auf Pilzinfektion mittels panfungale Breitspektrum PCR;"], "subBullets": {"afterItem": 1, "items": ["Abszessinhalt durch Punktion, Drainage oder Abszessexzision", "Blutkulturen (min. 2 Paar)"]}}, {"type": "paragraph", "text": "Wenn nicht per continuitatem: Fokussuche! Insbesondere Endokarditis sollte abgeklärt werden."}]}, {"id": "kap03-therapeutisch", "number": null, "title": "Therapeutische Empfehlungen:", "blocks": [{"type": "paragraph", "text": "Bei Erregernachweis Therapie anpassen, Anaerobier sollen abgedeckt bleiben auch wenn nur Aerobier nachgewiesen wurden - infektiologisches Konsil empfohlen."}]}, {"id": "kap03-3-1", "number": "3.1", "title": "Hirnabszess, ambulant erworben ohne vorhergehendes Trauma oder Hirn-OP ①②", "blocks": [{"type": "therapyTable", "columns": ["Erreger", "", "Therapie", "Dosierung", "Therapiedauer"], "rows": [{"cells": [{"text": "unbekannt\n(empirische Therapie)"}, {"text": "1. Wahl"}, {"text": "Cefotaxim\n+\nMetronidazol\n\n(+ Linezolid, wenn mit MRSA besiedelt)\n\n(+ Voriconazol ③, wenn nach Organ- oder Knochmarktransplantation)"}, {"text": "4 x 3 g i.v.\n+\n3 x 500 mg i.v.\n\n(+ 2 x 600 mg i.v.)\n\n(+2 x 6 mg/kg i.v. an Tag 1, dann 2 x 4 mg/kg i.v.)"}, {"text": "4-8 Wochen"}]}]}, {"type": "footnotes", "items": [{"marker": "①", "text": "Bei Toxoplasmoserisiko (z.B. HIV-Patienten, Immunsuppression) soll die empirische Therapie erweitert werden (siehe 3.3)."}, {"marker": "②", "text": "Nach Organ- und Knochenmarktransplantation soll die empirische Therapie um Voriconazol erweitert werden."}, {"marker": "③", "text": "Interaktionscheck und TDM empfohlen"}]}]}, {"id": "kap03-3-2", "number": "3.2", "title": "Hirnabszess, nosokomial (ab dem 5. Tag) oder mit vorhergehendem Trauma/Hirn-OP", "blocks": [{"type": "therapyTable", "columns": ["Erreger", "", "Therapie", "Dosierung", "Therapiedauer"], "rows": [{"cells": [{"text": "unbekannt\n(empirische Therapie)"}, {"text": "1. Wahl"}, {"text": "Meropenem\n+\nLinezolid"}, {"text": "3 x 2 g i.v.\n+\n2 x 600 mg i.v."}, {"text": "Rücksprache Infektionsdienst"}]}]}]}, {"id": "kap03-3-3", "number": "3.3", "title": "Verdacht auf bzw. gesicherte ZNS-Infektion durch Toxoplasma gondii (z.B. HIV-Patienten)", "blocks": [{"type": "therapyTable", "columns": ["Erreger", "", "Therapie", "Dosierung", "Therapiedauer"], "rows": [{"cells": [{"text": "Toxoplasma gondii", "rowspan": 3}, {"text": "1. Wahl"}, {"text": "Pyrimethamin ④\n+\nSulfadiazin"}, {"text": "Initial 1 x 200 mg p.o., dann 1 x 75 mg p.o.\n+\n4 x 1500 mg p.o."}, {"text": "Rücksprache Infektionsdienst", "rowspan": 3}]}, {"cells": [{"text": "Alternative"}, {"text": "Pyrimethamin ④\n+\nClindamycin"}, {"text": "Initial 1 x 200 mg p.o., dann 1 x 75 mg p.o.\n+\n4 x 600 mg i.v."}]}, {"cells": [{"text": "Alternative"}, {"text": "Cotrimoxazol"}, {"text": "2 x 5mg/kg i.v. bezogen auf Trimethoprim"}]}]}, {"type": "footnotes", "items": [{"marker": "④", "text": "+ Calciumfolinat (nicht Folsäure!), zur Vermeidung von hämatologischen Nebenwirkungen"}]}]}]}, {"id": "kap04", "chapter": "04", "title": "Ambulant erworbene Pneumonie ohne relevante Immunsuppression", "sections": [{"id": "kap04-diagnostik", "number": null, "title": "Diagnostische Empfehlungen/ Erforderliche Diagnostik", "blocks": [{"type": "bullets", "items": ["Sputum für Mikroskopie/Kultur", "PCR auf SARS-CoV2 sowie saisonal Influenza A /B und RSV aus Sputum oder Nasenrachenabstrich", "Urinantigentests auf Pneumokokken und Legionellen", "Bei schwerer CAP Blutkulturen (2x2 Paare)", "Bei schwerer CAP Pneumoniepanel (vorzugsweise BAL)"]}, {"type": "paragraph", "text": "Folgende Spezies sind keine Erreger der Pneumonie und daher bei Nachweis im Sputum irrelevant:"}, {"type": "bullets", "items": ["Viridans-Streptokokken,", "Koagulase-negative Staphylokokken,", "Enterokokken (inkl. VRE),", "Corynebakterien,", "Neisserien (außer seltenst N. meningitidis; N. gonorrhoeae),", "Haemophilus spp. (außer H. influenzae)", "und Candida spp."]}]}, {"id": "kap04-therapeutisch", "number": null, "title": "Therapeutische Empfehlungen", "blocks": [{"type": "criteria", "title": "CRB65-Score (jeweils ein Punkt):", "items": ["Confusion: akute Bewusstseinsstörung", "Respiratory rate: Atemfrequenz (AF) ≥30/min", "Blutdruck systolisch < 90 mmHg", "Alter ≥ 65"]}, {"type": "criteria", "title": "ATS/IDSA-MAJOR-Kriterien:", "items": ["Septischer Schock mit Vasopressor-Therapie", "Notwendigkeit der Intubation / Beatmung"]}, {"type": "criteria", "title": "ATS/IDSA-MINOR-Kriterien:", "items": ["Akute Bewusstseinsstörung", "Atemfrequenz (AF) ≥30/min", "Blutdruck systolisch < 90mmHg oder Laktat >2 mmol/l", "PaO2 ≤ 55 mmHg, SpO2 ≤ 91% bei RL oder PaO2/FIO2 ≤ 250", "Multilobuläre Infiltrate", "Akutes Nierenversagen", "Leukozyten < 4G/L", "Thrombozyten < 100 G/L", "Hypothermie (<36°C)"]}]}, {"id": "kap04-4-1", "number": "4.1", "title": "Leichte, ambulant erworbene Pneumonie ohne Komorbiditäten ①", "blocks": [{"type": "therapyTable", "columns": ["Erreger", "", "Therapie", "Dosierung", "Therapiedauer"], "rows": [{"cells": [{"text": "Empirisch\n(meist S. pneumoniae)", "rowspan": 4}, {"text": "1. Wahl"}, {"text": "Amoxicillin"}, {"text": "3 x 1 g p.o."}, {"text": "5 Tage\n(Bei Azithromycin nur 3 Tage!)", "rowspan": 4}]}, {"cells": [{"text": "Alternative", "rowspan": 3}, {"text": "Doxycyclin"}, {"text": "1 x 200 mg p.o."}]}, {"separatorBefore": "oder", "cells": [{"text": "Azithromycin ②"}, {"text": "1 x 500 mg p.o."}]}, {"separatorBefore": "oder", "cells": [{"text": "Levofloxacin ②"}, {"text": "2 x 500 mg p.o."}]}]}, {"type": "footnotes", "items": [{"marker": "①", "text": "Eine leichte, ambulant erworbene Pneumonie erfüllt folgende Kriterien", "items": ["Guter Allgemeinzustand", "Keine instabilen Komorbiditäten", "CRB65 = 0", "ATS/IDSA-Kriterien = 0"]}, {"marker": "②", "text": "QTc-Zeit und Risikofaktoren für Torsades de pointes beachten."}]}]}, {"id": "kap04-4-2", "number": "4.2", "title": "Leichte, ambulant erworbene Pneumonie mit Komorbiditäten ①③", "blocks": [{"type": "therapyTable", "columns": ["Erreger", "", "Therapie", "Dosierung", "Therapiedauer"], "rows": [{"cells": [{"text": "Empirisch", "rowspan": 2}, {"text": "1. Wahl"}, {"text": "Amoxicillin / Clavulansäure"}, {"text": "3 x 1 g p.o."}, {"text": "5 Tage"}]}, {"cells": [{"text": "Alternative"}, {"text": "Moxifloxacin ②"}, {"text": "1 x 400 mg p.o."}, {"text": "5 Tage"}]}]}, {"type": "footnotes", "items": [{"marker": "①", "text": "Eine leichte, ambulant erworbene Pneumonie erfüllt folgende Kriterien", "items": ["Guter Allgemeinzustand", "Keine instabilen Komorbiditäten", "CRB65 = 0", "ATS/IDSA-Kriterien = 0"]}, {"marker": "③", "text": "Als relevante Komorbiditäten gelten unter anderem Diabetes mellitus, COPD, chronische Nieren- oder Leberinsuffizienz, ZNS-Erkrankungen, etc."}, {"marker": "②", "text": "QTc-Zeit und Risikofaktoren für Torsades de pointes beachten."}]}]}, {"id": "kap04-4-3", "number": "4.3.", "title": "Mittelschwere Pneumonie ohne Pseudomonas-Risiko ④⑤", "blocks": [{"type": "therapyTable", "columns": ["Erreger", "", "Therapie", "Dosierung", "Therapiedauer"], "rows": [{"cells": [{"text": "Empirisch", "rowspan": 3}, {"text": "1. Wahl"}, {"text": "Ampicillin / Sulbactam"}, {"text": "3 x 3 g i.v."}, {"text": "5 Tage", "rowspan": 3}]}, {"cells": [{"text": "Alternative", "rowspan": 2}, {"text": "Cefotaxim"}, {"text": "3 x 2 g i.v."}]}, {"cells": [{"text": "Moxifloxacin ②\n(nur bei beta-Laktam-Unverträglichkeit)"}, {"text": "1 x 400 mg i.v."}]}]}, {"type": "footnotes", "items": [{"marker": "②", "text": "QTc-Zeit und Risikofaktoren für Torsades de pointes beachten."}, {"marker": "④", "text": "Eine mittelschwere, ambulant erworbene Pneumonie erfüllt zumindest eines der folgenden Kriterien", "items": ["Schlechter AZ", "Instabile Komorbidität", "CRB65 ≥ 1", "ATS/IDSA-MINOR Kriterien ≥ 1"]}, {"marker": "⑤", "text": "Als Pseudomonas Risikofaktoren gelten:", "items": ["Bronchiektasen", "Fortgeschrittene chronisch obstruktive Lungenerkrankung", "Häufige Exazerbationen", "Vorbekannte chronische Pseudomonas-Infektion"]}]}]}, {"id": "kap04-4-4", "number": "4.4", "title": "Schwere Pneumonie ohne Pseudomonas-Risiko ⑥⑦", "blocks": [{"type": "therapyTable", "columns": ["Erreger", "", "Therapie", "Dosierung", "Therapiedauer"], "rows": [{"cells": [{"text": "Empirisch", "rowspan": 2}, {"text": "1. Wahl"}, {"text": "Piperacillin / Tazobactam\n+\nAzithromycin ②⑧"}, {"text": "4 x 4,5 g i.v.\n+\n1 x 500 mg i.v."}, {"text": "7-10 Tage\n(Azithromycin maximal 3 Tage!)", "rowspan": 2}]}, {"cells": [{"text": "2. Wahl"}, {"text": "Cefotaxim\n+\nAzithromycin ②⑧"}, {"text": "3 x 2 g i.v.\n+\n1 x 500 mg i.v."}]}]}, {"type": "footnotes", "items": [{"marker": "②", "text": "QTc-Zeit und Risikofaktoren für Torsades de pointes beachten."}, {"marker": "⑥", "text": "Eine schwere, ambulant erworbene Pneumonie erfüllt zumindest eines der folgenden Kriterien:", "items": ["ATS/IDSA-MAJOR-Kriterien ≥ 1", "ATS/IDSA-MINOR-Kriterien ≥ 3", "Multiorganversagen"]}, {"marker": "⑦", "text": "Als Pseudomonas Risikofaktoren gelten:", "items": ["Bronchiektasen", "Fortgeschrittene chronisch obstruktive Lungenerkrankung", "Häufige Exazerbationen", "Vorbekannte chronische Pseudomonas-Infektion"]}, {"marker": "⑧", "text": "Nach Ausschluss von Mycoplasma pneumoniae, Chlamydophila pneumoniae und Legionella pneumophila absetzen."}]}]}, {"id": "kap04-4-5", "number": "4.5", "title": "Mittelschwere und schwere Pneumonie mit Pseudomonas-Risiko ④⑥⑦", "blocks": [{"type": "therapyTable", "columns": ["Erreger", "", "Therapie", "Dosierung", "Therapiedauer"], "rows": [{"cells": [{"text": "Empirisch", "rowspan": 3}, {"text": "1. Wahl"}, {"text": "Piperacillin / Tazobactam\n(bei schwerer Pneumonie\n+\nAzithromycin ②⑧)"}, {"text": "4 x 4,5 g i.v. über 3 Stunden\n+\n1 x 500 mg i.v."}, {"text": "7-10 Tage\n(Azithromycin maximal 3 Tage!)", "rowspan": 3}]}, {"cells": [{"text": "2. Wahl", "rowspan": 2}, {"text": "Cefepim ⑨\n(bei schwerer Pneumonie\n+\nAzithromycin ②⑧)"}, {"text": "3 x 2 g i.v. über 4 Stunden\n+\n1 x 500 mg i.v."}]}, {"cells": [{"text": "Meropenem\n(bei schwerer Pneumonie\n+\nAzithromycin ②⑧)"}, {"text": "3 x 2 g i.v.\n+\n1 x 500 mg i.v."}]}]}, {"type": "footnotes", "items": [{"marker": "②", "text": "QTc-Zeit und Risikofaktoren für Torsades de pointes beachten."}, {"marker": "④", "text": "Eine mittelschwere, ambulant erworbene Pneumonie erfüllt zumindest eines der folgenden Kriterien", "items": ["Schlechter AZ", "Instabile Komorbidität", "CRB65 ≥ 1", "ATS/IDSA-MINOR Kriterien ≥ 1"]}, {"marker": "⑥", "text": "Eine schwere, ambulant erworbene Pneumonie erfüllt zumindest eines der folgenden Kriterien:", "items": ["ATS/IDSA-MAJOR-Kriterien ≥ 1", "ATS/IDSA-MINOR-Kriterien ≥ 3", "Multiorganversagen"]}, {"marker": "⑦", "text": "Als Pseudomonas Risikofaktoren gelten:", "items": ["Bronchiektasen", "Fortgeschrittene chronisch obstruktive Lungenerkrankung", "Häufige Exazerbationen", "Vorbekannte chronische Pseudomonas-Infektion"]}, {"marker": "⑧", "text": "Nach Ausschluss von Mycoplasma pneumoniae, Chlamydophila pneumoniae und Legionella pneumophila absetzen."}, {"marker": "⑨", "text": "Nierenfunktion beachten, bei neurotoxischen Symptomen absetzen"}]}]}]}, {"id": "kap06", "chapter": "06", "title": "Aspirations- und Retentionspneumonie, Lungenabszess, Empyem", "sections": [{"id": "kap06-diagnostik", "number": null, "title": "Diagnostische Empfehlungen/ Erforderliche Diagnostik", "blocks": [{"type": "bullets", "items": ["Bronchoskopie mit Erregerdiagnostik aus BAL", "Bei Retentionspneumonie ist die Beseitigung der Stenose die wichtigste therapeutische Maßnahme", "Bei Lungenabszess und Pleuraempyem unbedingt Rücksprache mit Thoraxchirurgie zur chirurgischen Sanierung", "Bei Lungenabszess und Pleuraempyem sollte Material (Aspirat) zur mikrobiologischen Aufarbeitung gewonnen werden"]}]}, {"id": "kap06-therapeutisch", "number": null, "title": "Therapeutische Empfehlungen", "blocks": [{"type": "bullets", "items": ["Bei Nachweis eines ursächlichen Krankheitserregers ist eine gezielte Therapieanpassung (Monotherapie) anzustreben."]}]}, {"id": "kap06-6-1", "number": "6.1", "title": "Aspiration", "blocks": [{"type": "paragraph", "text": "Makro-Aspiration: die resultierende chemische Pneumonitis (Aspiration von saurem Mageninhalt) bessert sich typischerweise nach 1-2 Tagen. Keine prophylaktische antibakterielle Therapie. Reevaluation nach 48 Stunden."}]}, {"id": "kap06-6-2", "number": "6.2", "title": "Aspirationspneumonie, Retentionspneumonie", "blocks": [{"type": "paragraph", "text": "Eine Aspirationspneumonie entsteht i.d.R. durch rezidivierende Mikro-Aspirationen, oft unbeobachtet. Nach Makro-Aspiration eher selten sekundäre bakterielle Pneumonie (wenn, dann 2-7 Tage nach dem Ereignis). Risiko erhöht bei Einnahme von Protonenpumpenhemmern."}, {"type": "therapyTable", "columns": ["Erreger", "", "Therapie", "Dosierung", "Therapiedauer"], "rows": [{"cells": [{"text": "Empirisch", "rowspan": 2}, {"text": "1. Wahl"}, {"text": "Ampicillin/Sulbactam"}, {"text": "3 x 3g i.v."}, {"text": "5(-7) Tage", "rowspan": 2}]}, {"cells": [{"text": "2. Wahl"}, {"text": "Cefotaxim\n+/-\nMetronidazol ①"}, {"text": "3 x 2g i.v.\n+/-\n1 x 1500mg i.v."}]}]}, {"type": "footnotes", "items": [{"marker": "①", "text": "Anaerobier spielen bei der Aspirationspneumonie eine weniger wichtige Rolle als bislang gedacht. Eine zusätzliche Therapie mit Metronidazol ist nur bei hochgradigem Verdacht (z.B. beobachtete Aspiration, ausbleibende Besserung) empfohlen."}]}]}, {"id": "kap06-6-3", "number": "6.3", "title": "Lungenabszess", "blocks": [{"type": "therapyTable", "columns": ["Erreger", "", "Therapie", "Dosierung", "Therapiedauer"], "rows": [{"cells": [{"text": "Empirisch", "rowspan": 2}, {"text": "1. Wahl"}, {"text": "Ampicillin/Sulbactam"}, {"text": "4 x 3g i.v."}, {"text": "Bis zur klinischen Ausheilung (oft mehrere Wochen bis Monate) ②", "rowspan": 5}]}, {"cells": [{"text": "Alternative"}, {"text": "Cefotaxim\n+\nMetronidazol"}, {"text": "3 x 3g i.v.\n+\n1 x 1500mg i.v."}]}, {"cells": [{"text": "Methicillin-sensibler Staph. aureus"}, {"text": "1. Wahl"}, {"text": "Cefazolin"}, {"text": "3 x 3g i.v."}]}, {"cells": [{"text": "Methicillin-resistenter Staph. aureus", "rowspan": 2}, {"text": "1. Wahl"}, {"text": "Linezolid ③"}, {"text": "2 x 600mg i.v. oder p.o."}]}, {"cells": [{"text": "Alternative"}, {"text": "Ceftarolin"}, {"text": "3x 1200mg i.v."}]}]}, {"type": "footnotes", "items": [{"marker": "②", "text": "Sequenztherapie: Nach klinischem Ansprechen und radiologisch dokumentierter Rückbildung der Größe des Abszesses"}, {"marker": "③", "text": "Therapiedauer max. 28 Tage"}]}]}, {"id": "kap06-6-4", "number": "6.4", "title": "Pleuraempyem", "blocks": [{"type": "therapyTable", "columns": ["Erreger", "", "Therapie", "Dosierung", "Therapiedauer"], "rows": [{"cells": [{"text": "Empirisch", "rowspan": 2}, {"text": "1. Wahl"}, {"text": "Ampicillin/Sulbactam"}, {"text": "3-4x 3g i.v."}, {"text": "Nach Klinik ④", "rowspan": 5}]}, {"cells": [{"text": "Alternative"}, {"text": "Cefotaxim\n+\nMetronidazol"}, {"text": "3-4 x 2g i.v.\n+\n1 x 1500mg i.v."}]}, {"cells": [{"text": "MSSA"}, {"text": "1. Wahl"}, {"text": "Cefazolin"}, {"text": "3 x 3g i.v."}]}, {"cells": [{"text": "MRSA", "rowspan": 2}, {"text": "1. Wahl"}, {"text": "Linezolid ③"}, {"text": "2 x 600mg i.v. oder p.o."}]}, {"cells": [{"text": "Alternative"}, {"text": "Ceftarolin"}, {"text": "3x 1200 mg i.v."}]}]}, {"type": "footnotes", "items": [{"marker": "③", "text": "Therapiedauer max. 28 Tage"}, {"marker": "④", "text": "Mind. 14 Tage, sofern eine suffiziente Drainage der infizierten Pleurahöhle erfolgt und inflammatorische Reaktion rückläufig ist. In vielen Fällen deutlich längere Therapie notwendig → Rücksprache mit Infektionsdienst"}]}]}]}, {"id": "kap07", "chapter": "07", "title": "gezielte Therapie bei ausgewählten Pneumonie-Erregern", "sections": [{"id": "kap07-therapeutisch", "number": null, "title": "Therapeutische Empfehlungen", "blocks": [{"type": "paragraph", "text": "Bei Nachweis eines ursächlichen Krankheitserregers ist eine gezielte Therapieanpassung anzustreben. Bei fehlendem Nachweis eines atypischen bakteriellen Erregers soll eine ggf. eingeleitete Makrolidtherapie wieder beendet werden!"}]}, {"id": "kap07-7-1", "number": "7.1", "title": "Pneumokokken-Pneumonie", "blocks": [{"type": "therapyTable", "columns": ["Erreger", "", "Therapie", "Dosierung", "Therapiedauer"], "rows": [{"cells": [{"text": "Streptococcus pneumoniae", "rowspan": 2}, {"text": "1. Wahl (stationär)"}, {"text": "Penicillin G ①"}, {"text": "3 x 10 Mio. IE i.v."}, {"text": "5-7 Tage ②", "rowspan": 2}]}, {"cells": [{"text": "1. Wahl (ambulant)"}, {"text": "Amoxicillin"}, {"text": "3 x 1g p.o."}]}]}, {"type": "footnotes", "items": [{"marker": "①", "text": "Sequenztherapie nach mind. 3-tägiger i.v. Therapie evaluieren: 1. Wahl: Amoxicillin 3x1g p.o., Alternative: Cefalexin 3x1g p.o."}, {"marker": "②", "text": "leichte bis mittelschwere Pneumonie: 5 Tage, schwere Pneumonie: 7 Tage"}]}]}, {"id": "kap07-7-2", "number": "7.2", "title": "Staphylokokken-Pneumonie (MSSA)", "blocks": [{"type": "therapyTable", "columns": ["Erreger", "", "Therapie", "Dosierung", "Therapiedauer"], "rows": [{"cells": [{"text": "Methicillin-sensibler Staphylococcus aureus", "rowspan": 2}, {"text": "1. Wahl"}, {"text": "Cefazolin"}, {"text": "3 x 3g i.v."}, {"text": "14 Tage", "rowspan": 2}]}, {"cells": [{"text": "Alternative"}, {"text": "Flucloxacillin"}, {"text": "6 x 2 g i.v."}]}]}]}, {"id": "kap07-7-3", "number": "7.3", "title": "Staphylokokken-Pneumonie (MRSA)", "blocks": [{"type": "therapyTable", "columns": ["Erreger", "", "Therapie", "Dosierung", "Therapiedauer"], "rows": [{"cells": [{"text": "Methicillin-resistenter Staphylococcus aureus ③", "rowspan": 2}, {"text": "1. Wahl"}, {"text": "Linezolid"}, {"text": "2 x 600 mg p.o. oder i.v."}, {"text": "14 Tage", "rowspan": 2}]}, {"cells": [{"text": "Alternative ④"}, {"text": "Ceftarolin"}, {"text": "3 x 1200mg i.v."}]}]}, {"type": "footnotes", "items": [{"marker": "③", "text": "Krankenhaushygienische Vorschriften beachten!"}, {"marker": "④", "text": "Bei Pneumonie kein Daptomycin verwenden, wird durch Surfactant inaktiviert."}]}]}, {"id": "kap07-7-4", "number": "7.4", "title": "Legionellen-Pneumonie", "blocks": [{"type": "therapyTable", "columns": ["Erreger", "", "Therapie", "Dosierung", "Therapiedauer"], "rows": [{"cells": [{"text": "Legionella pneumophila", "rowspan": 2}, {"text": "1. Wahl"}, {"text": "Levofloxacin ⑤"}, {"text": "2 x 500 mg i.v. ⑥"}, {"text": "10 Tage\n(bei Immunsuppression und schwerer Erkrankung 21 Tage)"}]}, {"cells": [{"text": "Alternative"}, {"text": "Azithromycin ⑤"}, {"text": "1x500 mg i.v. ⑥"}, {"text": "7 Tage\n(nicht bei Immun-suppression oder schwerer Pneumonie)"}]}]}, {"type": "footnotes", "items": [{"marker": "⑤", "text": "QTc-Zeit und Risikofaktoren für Torsades de pointes beachten."}, {"marker": "⑥", "text": "nach klinischer Besserung Umstellung auf orale Therapie"}]}]}, {"id": "kap07-7-5", "number": "7.5", "title": "Mycoplasmen und Chlamydien-Pneumonie", "blocks": [{"type": "therapyTable", "columns": ["Erreger", "", "Therapie", "Dosierung", "Therapiedauer"], "rows": [{"cells": [{"text": "Mycoplasma pneumoniae, Chlamydia pneumophila", "rowspan": 3}, {"text": "1. Wahl"}, {"text": "Azithromycin ⑤⑦"}, {"text": "1 x 500 mg p.o. oder i.v."}, {"text": "5 Tage"}]}, {"cells": [{"text": "Alternative", "rowspan": 2}, {"text": "Levofloxacin ⑤"}, {"text": "2 x 500 mg p.o. oder i.v."}, {"text": "7 Tage", "rowspan": 2}]}, {"cells": [{"text": "Doxycyclin"}, {"text": "2 x 100 mg p.o. oder i.v."}]}]}, {"type": "footnotes", "items": [{"marker": "⑤", "text": "QTc-Zeit und Risikofaktoren für Torsades de pointes beachten."}, {"marker": "⑦", "text": "bei ausbleibender Besserung nach 48h Switch auf eine unter „Alternative“ aufgeführte Substanz"}]}]}, {"id": "kap07-7-6", "number": "7.6", "title": "Influenza-Pneumonie ⑧, siehe auch Kapitel Influenza", "blocks": [{"type": "therapyTable", "columns": ["Erreger", "", "Therapie", "Dosierung", "Therapiedauer"], "rows": [{"cells": [{"text": "Influenza A / B"}, {"text": "1. Wahl"}, {"text": "Oseltamivir"}, {"text": "2 x 75 mg p.o."}, {"text": "10 Tage"}]}]}, {"type": "footnotes", "items": [{"marker": "⑧", "text": "bei ambulantem Management nur sinnvoll wenn Symptombeginn nicht länger als 48h zurück"}]}]}]}, {"id": "kap08", "chapter": "08", "title": "Katheter-assoziierte Infektionen", "sections": [{"id": "kap08-diagnostik", "number": null, "title": "Diagnostische Empfehlungen/ Erforderliche Diagnostik", "blocks": [{"type": "bullets", "items": ["Entnahme von Kulturen sowohl aus dem Katheter als auch parallel dazu aus einer peripheren Vene.", "Die Katheterspitze sollte nicht routinemäßig, sondern nur bei Verdacht auf eine Katheter-assoziierte Infektion eingesandt werden."], "subBullets": {"afterItem": 0, "items": ["Wachstum desselben Erregers >2h schneller in der zentralen Kultur spricht zusätzlich für einen infizierten Katheter.", "Auf identes Probenvolumen in zentralen und peripheren Blutkulturflaschen ist genau zu achten, da ansonsten keine Aussagekraft gegeben ist."]}}]}, {"id": "kap08-therapeutisch", "number": null, "title": "Therapeutische Empfehlungen", "blocks": [{"type": "bullets", "items": ["Eine Entfernung des Katheters bei Infektion ist immer empfohlen. Das Belassen des Katheters mit Rettungsversuch ist Situationen vorbehalten, bei denen ein vital indizierter Katheter nicht ersetzt werden kann (z.B. out-of-vessel Situation) in Kombination mit Keimen niedriger Pathogenität (z.B. Coagulase-negative Staphylokokken, Corynebakterien, Micrococcus luteus, etc.).", "Ein verzögertes Entfernen des Katheters bei S. aureus ist mit hämatogenen Komplikationen (metastatischen Abszessen, Endokarditis, etc.) bzw. bei Gram-negativen Erregern mit erhöhter Mortalität verbunden.", "Eine Entfernung des Katheters ist somit dringend angezeigt bei:", "Ein Katheterwechsel über einen Führungsdraht wird nicht empfohlen.", "Bei Katheterwechsel ist eine katheterfreie Periode wünschenswert", "Eine Salvage-Therapie besteht immer aus lokaler Therapie in Kombination mit systemischer Therapie. Außerdem muss eine Aspiration möglich sein."], "subBullets": {"afterItem": 2, "items": ["Klinischer Verschlechterung, Sepsis bzw. septischem Schock", "Komplikationen (Endokarditis, septische Thrombose, Abszessformationen, Osteomyelitis, etc.)", "Nachweis von S. aureus, Candida spp. und Gram-negativen Erregern."]}}]}, {"id": "kap08-8-1", "number": "8.1", "title": "Zentrale Katheterinfektion durch Koagulase-negative Staphylokokken", "blocks": [{"type": "therapyTable", "columns": ["Erreger", "", "Therapie", "Dosierung", "Therapiedauer"], "rows": [{"cells": [{"text": "Koagulase-negative Staphylokokken", "rowspan": 2}, {"text": "1. Wahl"}, {"text": "Entfernung des Katheters ohne systemische Therapie\n(bei stabilen PatientInnen)"}, {"text": "-"}, {"text": "-"}]}, {"cells": [{"text": "Alternative"}, {"text": "Daptomycin ①"}, {"text": "1 x 10 - 12 mg/kg KG i.v. ②"}, {"text": "5-7 Tage"}]}]}, {"type": "footnotes", "items": [{"marker": "①", "text": "Eosinophile und Kreatinphosphokinase (CK) Kontrolle 2 x/ Woche"}, {"marker": "②", "text": "Daptomycin steht als 350 mg und 500 mg Durchstichflasche zur Verfügung – Dosis aufrunden auf nächstgrößere Packung"}]}]}, {"id": "kap08-8-2", "number": "8.2", "title": "Zentrale Katheterinfektion durch Staphylococcous aureus oder Staphylococcus lugdunensis", "blocks": [{"type": "therapyTable", "columns": ["Erreger", "", "Therapie", "Dosierung", "Therapiedauer"], "rows": [{"cells": [{"text": "S. aureus (MSSA)\nS. lugdunensis\n(siehe auch Kapitel S. aureus Bakteriämie)"}, {"text": "1. Wahl"}, {"text": "Entfernung des Katheters\n+\nCefazolin"}, {"text": "3 x 2 g i.v."}, {"text": "mindestens 14 Tage, bei Komplikationen nach RS mit Infektionsdienst"}]}, {"cells": [{"text": "S. aureus (MRSA)"}, {"text": "1. Wahl"}, {"text": "Entfernung des Katheters\n+\nDaptomycin ①"}, {"text": "1 x 10 – 12 mg/kg KG i.v. ②"}, {"text": "mindestens 14 Tage, bei Komplikationen nach RS mit Infektionsdienst"}]}]}, {"type": "footnotes", "items": [{"marker": "①", "text": "Eosinophile und Kreatinphosphokinase (CK) Kontrolle 2 x/ Woche"}, {"marker": "②", "text": "Daptomycin steht als 350 mg und 500 mg Durchstichflasche zur Verfügung – Dosis aufrunden auf nächstgrößere Packung"}]}]}, {"id": "kap08-8-3-enterokokken", "number": "8.3", "title": "Zentrale Katheterinfektion durch Enterokokken", "blocks": [{"type": "therapyTable", "columns": ["Erreger", "", "Therapie", "Dosierung", "Therapiedauer"], "rows": [{"cells": [{"text": "E. faecalis", "rowspan": 2}, {"text": "1. Wahl"}, {"text": "Entfernung des Katheters\n+\nAmpicillin mono"}, {"text": "6 x 2 g i.v.\noder\n4 x 3 g i.v."}, {"text": "5-7 Tage nach Abfiebern", "rowspan": 2}]}, {"cells": [{"text": "2. Wahl"}, {"text": "Entfernung des Katheters\n+\nDaptomycin ①"}, {"text": "1 x 10 - 12 mg/kg KG i.v. ②"}]}, {"cells": [{"text": "E. faecium", "rowspan": 2}, {"text": "1. Wahl"}, {"text": "Entfernung des Katheters\n+\nTeicoplanin"}, {"text": "3 Gaben:\n12 mg/kg i.v. alle 12 h,\ndann 12 mg/kg i.v. 1 x tgl.\nTDM empfohlen ③"}, {"text": "5-7 Tage nach Abfiebern", "rowspan": 2}]}, {"cells": [{"text": "2. Wahl\n(nur bei VRE)"}, {"text": "Entfernung des Katheters\n+\nLinezolid"}, {"text": "2 x 600 mg i.v."}]}]}, {"type": "footnotes", "items": [{"marker": "①", "text": "Eosinophile und Kreatinphosphokinase (CK) Kontrolle 2 x/ Woche"}, {"marker": "②", "text": "Daptomycin steht als 350 mg und 500 mg Durchstichflasche zur Verfügung – Dosis aufrunden auf nächstgrößere Packung"}, {"marker": "③", "text": "Zieltalspiegel 20 - 40 µg/ml (= mg/L)"}]}]}, {"id": "kap08-8-3-gramnegativ", "number": "8.3", "title": "Zentrale Katheterinfektion durch Gram-negative Erreger", "blocks": [{"type": "therapyTable", "columns": ["Erreger", "", "Therapie", "Dosierung", "Therapiedauer"], "rows": [{"cells": [{"text": "E. coli,\nK. pneumoniae,\nC. koseri"}, {"text": "1. Wahl"}, {"text": "Entfernung des Katheters\n+\nCefotaxim\n(+ Anpassung nach Antibiogramm)"}, {"text": "3 x 2 g i.v."}, {"text": "7 Tage"}]}, {"cells": [{"text": "Enterobacter sp.,\nK. aerogenes,\nH. alvei, C. freundii"}, {"text": "1. Wahl"}, {"text": "Entfernung des Katheters\n+\nCefepim ④\n(+ Anpassung nach Antibiogramm)"}, {"text": "3 x 2 g i.v."}, {"text": "7 Tage"}]}, {"cells": [{"text": "P. aeruginosa"}, {"text": "1. Wahl"}, {"text": "Entfernung des Katheters\n+\nPiperacillin/Tazobactam\n(+ Anpassung nach Antibiogramm)"}, {"text": "4 x 4,5 g i.v."}, {"text": "7 Tage"}]}, {"cells": [{"text": "A. baumannii"}, {"text": "1. Wahl"}, {"text": "Entfernung des Katheters\n+\nAmpicillin/Sulbactam\n(+ Anpassung nach Antibiogramm)"}, {"text": "3 x 3 g i.v."}, {"text": "7 Tage"}]}]}, {"type": "footnotes", "items": [{"marker": "④", "text": "Nierenfunktion beachten, bei neurotoxischen Symptomen absetzen"}]}]}, {"id": "kap08-8-3-candida", "number": "8.3", "title": "Zentrale Katheterinfektion durch Candida spp. ⑤", "blocks": [{"type": "therapyTable", "columns": ["Erreger", "", "Therapie", "Dosierung", "Therapiedauer"], "rows": [{"cells": [{"text": "Candida spp.", "rowspan": 3}, {"text": "1. Wahl"}, {"text": "Entfernung des Katheters\n+\nCaspofungin"}, {"text": "KG > 80 kg: 1 x 70 mg/d i.v.\nKG ≤ 80 kg: Tag 1: 1 x 70 mg i.v.\nAb Tag 2: 1 x 50 mg i.v."}, {"text": "mind. 14 Tage nach erster negativer Blutkultur", "rowspan": 3}]}, {"cells": [{"text": "1. Wahl"}, {"text": "Entfernung des Katheters\n+\nAnidulafungin"}, {"text": "Loading: 1 x 200 mg i.v., danach 1 x 100 mg/d i.v."}]}, {"cells": [{"text": "1. Wahl"}, {"text": "Entfernung des Katheters\n+\nMicafungin"}, {"text": "1 x 100 mg i.v."}]}]}, {"type": "footnotes", "items": [{"marker": "⑤", "text": "Bei Komplikationen (z.B. Endokarditis, septische Emboli, Augenbeteiligung, etc.) Therapie für 4 - 6 Wochen nach erster negativer Blutkultur."}]}]}]}, {"id": "kap09", "chapter": "09", "title": "Endokarditis", "sections": [{"id": "kap09-diagnostik", "number": null, "title": "Diagnostische Empfehlungen/ Erforderliche Diagnostik:", "blocks": [{"type": "bullets", "items": ["Abnahme von mindestens 3 Sets unabhängigen Blutkulturen (BK) (aerob/anaerob, jeweils 10 ml pro Flasche) vor Einleitung einer Antibiotikatherapie und unabhängig von der aktuellen Körpertemperatur (Fieber).", "Der Verdacht auf eine infektiöse Endokarditis ist der Mikrobiologie mitzuteilen – wichtig für die Diagnostik (längere Bebrütung der Blutkulturflaschen).", "nach mind. 3 Sets negative Blutkulturen -> bakterielle Breitspektrum-PCR anfordern (mit Vermerk „Vd. auf Kultur-negative Endokarditis“).", "bei hochgradigem Verdacht auf Endokarditis (z.B. TTE/TEE mit Vegetationen) und mind. 3 negative Sets Blutkulturen: spezifische PCR bzw. Serologie für seltene Endokarditis-Erreger (Bartonella, Coxiella, Brucella, etc.)"]}]}, {"id": "kap09-therapeutisch", "number": null, "title": "Therapeutische Empfehlungen", "blocks": [{"type": "bullets", "items": ["Als „künstliche Herzklappe“ gilt jegliches implantiertes Fremdmaterial (keine Unterscheidung zwischen Kunst- und Bioklappe, Devices, Sonden, etc.)!", "Vorstellung der Patientin / des Patienten im Endokarditis-Board (über Mail an endokarditis-team@meduniwien.ac.at mit Kontaktdatenblatt)!", "Abnahme von Folge-Blutkulturen 2x/Woche mit jeweils 2 Sets unabhängigen Blutkulturen (aerob/anaerob, jeweils 10 ml pro Flasche)!", "bei Erregernachweis gezielte Anpassung der antibiotischen Therapie!", "Suche und Sanierung der Eintrittspforte bzw. von weiteren Foci, insbesondere bei S. aureus!", "Therapiedauer: zählt ab dem Tag der 1. negativen Blutkultur bzw. ab Tag der OP bei Wachstum auf der Klappe (siehe mikrobiologischer Befund)"]}]}, {"id": "kap09-9-1", "number": "9.1", "title": "Initiale empirische Therapie bei unbekanntem Erreger und Nativklappen oder künstliche Herzklappe >12 Monate nach Implantation", "blocks": [{"type": "therapyTable", "columns": ["Häufige Erreger", "", "Therapie", "Dosierung", "Therapiedauer"], "rows": [{"cells": [{"text": "Staphylokokken\nStreptokokken\nE. faecalis", "rowspan": 2}, {"text": "1. Wahl"}, {"text": "Ampicillin/Sulbactam"}, {"text": "4x3g"}, {"text": "s. Therapie spezifischer Erreger", "rowspan": 2}]}, {"cells": [{"text": "Alternative\n(z.B. bei Besiedelung mit MRSA; healthcare-associated Endokarditis)"}, {"text": "Daptomycin ①\n+\nCefotaxim"}, {"text": "10-12 mg / kg KG 1x tgl.\n+\n3x3g"}]}]}, {"type": "footnotes", "items": [{"marker": "①", "text": "Eosinophile und Kreatinphosphokinase (CK) Kontrolle 2x/ Woche"}]}]}, {"id": "kap09-9-2", "number": "9.2", "title": "Initial empirische Therapie bei unbekanntem Erreger und künstlicher Herzklappe ( ≤12 Monate nach Implantation)", "blocks": [{"type": "therapyTable", "columns": ["Häufige Erreger", "", "Therapie", "Dosierung", "Therapiedauer"], "rows": [{"cells": [{"text": "Koagulase-negative Staphylokokken, S. aureus, Gram-negative Enterobakterien, Enterokokken, Streptokokken"}, {"text": "1. Wahl"}, {"text": "Daptomycin ①\n+\nCefotaxim"}, {"text": "10-12 mg / kg KG 1x tgl.\n+\n3x3g"}, {"text": "s. Therapie spezifischer Erreger"}]}]}, {"type": "footnotes", "items": [{"marker": "①", "text": "Eosinophile und Kreatinphosphokinase (CK) Kontrolle 2x/ Woche"}]}]}, {"id": "kap09-9-3", "number": "9.3", "title": "Spezifische Therapie bei bekanntem Erreger", "blocks": [{"type": "therapyTable", "columns": ["Erreger", "", "Therapie", "Dosierung", "Therapiedauer ②"], "rows": [{"cells": [{"text": "Streptokokken\n(Penicillin MHK <0.5)", "rowspan": 2}, {"text": "1. Wahl"}, {"text": "Penicillin G"}, {"text": "3 x 10 Mio. IE über 3 h"}, {"text": "Nach Vorgabe durch Endokarditis-Board, in der Regel mind. 4 Wochen (Nativklappe); mind. 6 Wochen (künstliche Klappe)", "rowspan": 2}]}, {"cells": [{"text": "Alternative"}, {"text": "Ampicillin"}, {"text": "4 x 3 g über 3 h"}]}, {"cells": [{"text": "Streptokokken\n(Penicillin MHK 0.5-2 μg/mL)"}, {"text": "1. Wahl"}, {"text": "Cefotaxim"}, {"text": "3x3g"}, {"text": "Nach Vorgabe durch Endokarditis-Board, in der Regel mind. 6 Wochen", "rowspan": 7}]}, {"cells": [{"text": "Streptokokken\n(Penicillin MHK >2 μg/mL)"}, {"text": "1. Wahl"}, {"text": "RS mit Infektionsdienst / Endokarditisboard", "colspan": 2}]}, {"cells": [{"text": "Staphylokokken\n(Oxacillin-empfindlich; MSSA)"}, {"text": "1. Wahl"}, {"text": "Cefazolin"}, {"text": "3x3g"}]}, {"cells": [{"text": "Staphylokokken\n(Oxacillin-resistent; MRSA)"}, {"text": "1. Wahl"}, {"text": "Daptomycin ①\n+\nFosfomycin ③"}, {"text": "10-12 mg / kg KG 1x tgl.\n+\n3x4g"}]}, {"cells": [{"text": "Enterococcus faecalis\n(non-VRE)"}, {"text": "1. Wahl"}, {"text": "Ampicillin\n+/-\nCeftriaxon"}, {"text": "4x3g\n+/-\n2x2g"}]}, {"cells": [{"text": "Enterococcus faecium"}, {"text": "1. Wahl"}, {"text": "RS mit Infektionsdienst / Endokarditisboard", "colspan": 2}]}, {"cells": [{"text": "VRE"}, {"text": "1. Wahl"}, {"text": "RS mit Infektionsdienst / Endokarditisboard", "colspan": 2}]}, {"cells": [{"text": "HACEK-Gruppe"}, {"text": "1. Wahl"}, {"text": "Cefotaxim"}, {"text": "3x2g"}, {"text": "Nach Vorgabe durch Endokarditis-Board, in der Regel mind. 4 Wochen (Nativklappe); mind. 6 Wochen (künstliche Klappe)"}]}]}, {"type": "footnotes", "items": [{"marker": "①", "text": "Eosinophile und Kreatinphosphokinase (CK) Kontrolle 2x/ Woche"}, {"marker": "②", "text": "Umstellung auf per os Therapie frühestens nach 2 Wochen und immer nach RS mit Infektionsdienst / Endokarditisboard."}, {"marker": "③", "text": "regelmäßige Elektrolytkontrollen (Natrium und Kalium!)"}]}]}]}, {"id": "kap10", "chapter": "10", "title": "Clostridioides difficile Infektion", "sections": [{"id": "kap10-diagnostik", "number": null, "title": "Diagnostische Empfehlungen/ Erforderliche Diagnostik", "blocks": [{"type": "bullets", "items": ["Die Diagnose einer C. difficile-Enterocolitis kann nur bei klinischer Symptomatik und mikrobiologischer Diagnose gestellt werden! Neben der klinischen Symptomatik muss mikrobiologisch sowohl C. difficile (GDH positiv) als auch ToxinA/B oder das Toxin-Gen nachgewiesen werden. Ein alleiniger Nachweis mittels PCR eines toxigenen C. difficile Stamms ist ebenso als positiv zu werten. Der Nachweis von C. difficile (GDH positiv) ohne gleichzeitigem Nachweis von ToxinA/B oder dem Toxin-Gen gilt als Carrier und eine Infektion somit als unwahrscheinlich.", "Eine mikrobiologische Verlaufskontrolle soll nicht durchgeführt werden! Der Therapieerfolg ist ausschließlich an Hand der Symptomatik zu beurteilen."]}]}, {"id": "kap10-therapeutisch", "number": null, "title": "Therapeutische Empfehlungen", "blocks": [{"type": "bullets", "items": ["Behandlungsindikationen", "Nicht zwingend notwendige antimikrobielle Therapie absetzen!", "Auf adäquate Elektrolyt- und Flüssigkeitssubstitution achten", "Motilitätshemmende Medikation vermeiden (z.B. Loperamid)", "Einsatz von Protonenpumpenhemmern (PPI) reevaluieren und ggf. absetzen"], "subBullets": {"afterItem": 0, "items": ["Keine Therapie bei asymptomatischen Trägern", "Spezifische Therapie bei symptomatischer gesicherter CDI", "Spezifische Therapie bei starkem klinischen Verdacht auf CDI und fehlender Möglichkeit mikrobiologischer Diagnostik", "Therapie bereits bei Verdacht auf schwere CDI (Fieber oder Leukozytose >15,000/mL oder Kreatinin 1,5fach über Ausgangswert oder bildgebende Hinweise auf schwere Colitis)"]}}]}, {"id": "kap10-10-1", "number": "10.1", "title": "C. difficile assoziierte Kolitis, Erstereignis", "blocks": [{"type": "therapyTable", "columns": ["Erreger", "", "Therapie", "Dosierung", "Therapiedauer"], "rows": [{"cells": [{"text": "C. difficile", "rowspan": 3}, {"text": "1. Wahl"}, {"text": "Fidaxomicin"}, {"text": "2 x 200 mg p.o."}, {"text": "10 Tage"}]}, {"cells": [{"text": "Alternative", "rowspan": 2}, {"text": "Vancomycin ①"}, {"text": "4 x 125 mg p.o."}, {"text": "10 Tage", "rowspan": 2}]}, {"cells": [{"text": "Teicoplanin"}, {"text": "2 x 200 mg p.o. ②"}]}]}, {"type": "footnotes", "items": [{"marker": "①", "text": "Erste Wahl bei Schwangeren; für die orale Applikation von Vancomycin werden Kapseln von der Anstaltsapotheke zur Verfügung gestellt: VANCOMYCIN KPS 125MG 40ST, SAP-Nr.: 20079680"}, {"marker": "②", "text": "Rekonstitution siehe unten"}]}]}, {"id": "kap10-10-2", "number": "10.2", "title": "C. difficile assoziierte Kolitis, orale Therapie nicht möglich oder fulminanter Verlauf ③", "blocks": [{"type": "therapyTable", "columns": ["Erreger", "", "Therapie", "Dosierung", "Therapiedauer"], "rows": [{"cells": [{"text": "C. difficile"}, {"text": "1. Wahl"}, {"text": "Vancomycin ①\nzusätzlich\nMetronidazol\noder\nTigecyclin ②"}, {"text": "4 x 500 mg ①\nzusätzlich\n3 x 500 mg i.v.\noder\n2 x 50 mg i.v."}, {"text": "14 Tage"}]}]}, {"type": "footnotes", "items": [{"marker": "①", "text": "Als Einlauf oder über Sonde; 500 mg Vancomycin in 100 ml 0,9% NaCl alle 6 h"}, {"marker": "②", "text": "100 mg Loading dose"}, {"marker": "③", "text": "Evaluierung durch Allgemeinchirurgie zur Operation"}]}]}, {"id": "kap10-10-3-rezidiv1", "number": "10.3", "title": "C. difficile assoziierte Kolitis, 1. Rezidiv", "blocks": [{"type": "therapyTable", "columns": ["Erreger", "", "Therapie", "Dosierung", "Therapiedauer"], "rows": [{"cells": [{"text": "C. difficile", "rowspan": 3}, {"text": "Wenn zuvor Vancomycin, Teicoplanin oder Metronidazol verwendet wurde"}, {"text": "Fidaxomicin"}, {"text": "2 x 200 mg p.o."}, {"text": "10 Tage"}]}, {"cells": [{"text": "Wenn zuvor Fidaxomicin verwendet wurde", "rowspan": 2}, {"text": "Vancomycin\noder\nTeicoplanin\nZusätzlich möglich:\nBezlotoxumab (Zinplava®) ③"}, {"text": "4 x 125 mg p.o. ①\noder\n2 x 200 mg p.o. ②"}, {"text": "10 Tage"}]}, {"cells": [{"text": "Vancomycin „pulse & taper“"}, {"text": "4 x 125 mg/d p.o.\n2 x 125 mg/d p.o.\n1 x 125 mg/d p.o.\n125 mg jeden 2.-3. Tag p.o."}, {"text": "14 Tage\n7 Tage\n7 Tage\n2-8 Wochen"}]}]}, {"type": "footnotes", "items": [{"marker": "①", "text": "Für die orale Applikation von Vancomycin werden Kapseln von der Anstaltsapotheke zur Verfügung gestellt: VANCOMYCIN KPS 125MG 40ST, SAP-Nr.: 20079680"}, {"marker": "②", "text": "Rekonstitution siehe unten"}, {"marker": "③", "text": "Rücksprache mit dem Infektionsdienst"}]}]}, {"id": "kap10-10-3-rezidiv2", "number": "10.3", "title": "C. difficile assoziierte Kolitis, ab 2. Rezidiv ①", "blocks": [{"type": "therapyTable", "columns": ["Erreger", "", "Therapie", "Dosierung", "Therapiedauer"], "rows": [{"cells": [{"text": "C. difficile", "rowspan": 2}, {"text": "1. Wahl"}, {"text": "Fidaxomicin\n\nZusätzlich empfohlen:\nBezlotoxumab (Zinplava®) ②"}, {"text": "2 x 200 mg p.o. für 5 Tage, danach 1 x 200 mg p.o. jeden zweiten Tag für 20 Tage (i.e. 10 Dosen)"}, {"text": "25 Tage"}]}, {"cells": [{"text": "zusätzlich"}, {"text": "Fäkale Mikrobiotatransplantation"}, {"text": "Kontaktaufnahme mit Dr. Frick, PhD (81-6362) oder dem gastroenterologischen Konsiliardienst (KLAT)", "colspan": 2}]}]}, {"type": "footnotes", "items": [{"marker": "①", "text": "Ggf. gastroenterologisches oder infektiologisches Konsil einholen"}, {"marker": "②", "text": "Rücksprache mit dem Infektionsdienst"}]}]}, {"id": "kap10-rekonstitution", "number": null, "title": "Rekonstitution der Durchstechflaschen zur peroralen Applikation von Teicoplanin:", "blocks": [{"type": "table", "columns": ["Arzneispezialität", "Volumen", "Endkonzentration", "Haltbarkeit bei 2-8 °C"], "rows": [{"cells": [{"text": "TEICOPLANIN® 200 mg Plv."}, {"text": "3,14 + 25 ml ①"}, {"text": "7,1 mg/ml"}, {"text": "24 h"}]}]}, {"type": "footnotes", "items": [{"marker": "①", "text": "Mit Aqua dest. rekonstituieren. Die so zubereiteten Lösungen können dann zur oralen Anwendung bis zu 24h im Kühlschrank aufbewahrt werden. Es können ggf. auch Geschmackskorrigenzien (Sirupe, Saft) hinzugefügt werden. Wichtig ist eine Kennzeichnung der Ampullen („zur oralen Applikation“, Datum der Rekonstitution) um Verwechslungen mit parenteral zu applizierenden Lösungen zu vermeiden!"}]}]}, {"id": "kap10-extramural", "number": null, "title": "Extramurale Verordnung:", "blocks": [{"type": "paragraph", "text": "DIFICLIR® (FIDAXOMICIN) kann nach chefärztlicher Bewilligung (RE1) verordnet werden."}, {"type": "paragraph", "text": "Vancomycin-Kapseln können entweder als VANCOMYCIN Dr. Eberth® Kps. (RE1) oder als magistrale Rezeptur, jeweils nach chefärztlicher Bewilligung, verordnet werden. Sie finden die magistralen Rezepturen in eMedic unter „Vancomycin 125 mg Kps. 40 Stk.“ bzw. „Vancomycin 250 mg Kps. 40 Stk.“."}, {"type": "paragraph", "text": "Bitte planen Sie die Verordnung rechtzeitig und reichen Sie das Rezept gemeinsam mit dem mikrobiologischen Nachweis zur chefärztlichen Bewilligung ein! Die Kosten für Teicoplanin werden extramural nicht übernommen, bitte stellen Sie die mit Teicoplanin anbehandelten Patient*innen im Zuge der Entlassung auf Vancomycin um."}]}]}, {"id": "kap11-1", "chapter": "11.1", "title": "Asymptomatische Bakteriurie", "sections": [{"id": "kap11-1-diagnostik", "number": null, "title": "Diagnostische Empfehlungen/ Erforderliche Diagnostik", "blocks": [{"type": "bullets", "items": ["Bei Vorhandensein eines Dauerkatheters (DK) DK-Wechsel!"]}]}, {"id": "kap11-1-1", "number": "11.1.1", "title": "Asymptomatische Bakteriurie, nicht schwanger, keine urologische Intervention am Harntrakt bevorstehend", "blocks": [{"type": "therapyTable", "columns": ["Erreger", "Therapie"], "rows": [{"cells": [{"text": "Enterobacterales\nEnterokokken\nbei Dauerkatheter auch Pseudomonas spp.\nHefepilze"}, {"text": "DK entfernen\n+\nKEINE antimikrobielle Therapie"}]}]}]}, {"id": "kap11-1-2", "number": "11.1.2", "title": "Asymptomatische Bakteriurie vor urologischer Intervention am Harntrakt, ggfs. bei bestehender Schwangerschaft", "blocks": [{"type": "therapyTable", "columns": ["Erreger", "Therapie", "Therapiedauer"], "rows": [{"cells": [{"text": "Enterobacterales\nEnterokokken\nbei Dauerkatheter auch Pseudomonas spp.\nHefepilze"}, {"text": "DK entfernen\n+\nGezielte Therapie nach Antibiogramm, möglichst schmales Spektrum."}, {"text": "3-5 Tage"}]}]}]}]}, {"id": "kap11-2", "chapter": "11.2", "title": "Unkomplizierte und komplizierte Zystitis", "sections": [{"id": "kap11-2-diagnostik", "number": null, "title": "Diagnostische Empfehlungen/ Erforderliche Diagnostik", "blocks": [{"type": "bullets", "items": ["Keine Einsendung von Eintauchkulturen (z.B. Uricult®), sondern Nativharn verwenden!", "Bei unkompliziertem Harnwegsinfekt der Frau kann eine Harnkultur eingeschickt werden. Bei Therapieversagen muss eine Harnkultur eingeschickt werden (Mittelstrahlharn)."]}]}, {"id": "kap11-2-therapeutisch", "number": null, "title": "Therapeutische Empfehlungen", "blocks": [{"type": "numberedList", "title": "Katheter-assoziierte Harnwegsinfektionen (HWI):", "items": ["Harnkatheter entfernen", "Harnkultur aus dem frisch gesetzten Harnkatheter (falls weiterhin indiziert)", "Empirische Therapie entsprechend „11.2.2 komplizierte Zystitis“", "Therapieanpassung nach Erhalt des Antibiogramms"]}, {"type": "numberedList", "title": "Zystitis bei Männern:", "items": ["Bei Männern ist von einer komplizierten Harnwegsinfektion auszugehen", "Empirische Therapie entsprechend „11.2.2 komplizierte Zystitis“ (solange keine klinischen Anzeichen einer akuten Prostatitis bestehen – im Zweifel urologisches Konsil)", "Alle Männer mit HWI unklarer Ursache sollen im Verlauf urologisch vorgestellt werden.", "Auf regelmäßiges Trinken muss geachtet werden."]}]}, {"id": "kap11-2-1", "number": "11.2.1", "title": "Unkomplizierte Zystitis der Frau (Therapie nicht zwingend erforderlich)", "blocks": [{"type": "therapyTable", "columns": ["Erreger", "", "Therapie", "Dosierung", "Therapiedauer"], "rows": [{"cells": [{"text": "Empirisch\n(E. coli, K. pneumoniae, Proteus spp., S. saprophyticus ④, etc. zu erwarten)", "rowspan": 3}, {"text": "1. Wahl"}, {"text": "Pivmecillinam ①"}, {"text": "3 x 400 mg p.o."}, {"text": "3 Tage"}]}, {"cells": [{"text": "Penicillinallergie"}, {"text": "Fosfomycin ②"}, {"text": "1 x 3 g p.o. Tag 0 und Tag 3"}, {"text": "2 Dosen"}]}, {"cells": [{"text": "Alternative"}, {"text": "Nitrofurantoin retard ③"}, {"text": "2 x 100 mg p.o."}, {"text": "5 Tage"}]}]}, {"type": "footnotes", "items": [{"marker": "①", "text": "Einsatz in der Schwangerschaft möglich."}, {"marker": "②", "text": "Fosfomycin sollte auf leeren Magen (2–3 h vor oder 2–3 h nach einer Mahlzeit) vorzugsweise vor dem Zubettgehen und nach Entleeren der Harnblase angewendet werden. Die Dosis wird in einem Glas Wasser aufgelöst und sofort nach der Zubereitung eingenommen. Wiederholung am Tag 3. Einsatz in der Schwangerschaft möglich."}, {"marker": "③", "text": "CAVE: kontraindiziert bei einer GFR <45ml/min, 3. Trimenon", "warning": true}, {"marker": "④", "text": "Intrinsische Resistenz gegenüber Fosfomycin"}]}]}, {"id": "kap11-2-2", "number": "11.2.2", "title": "Komplizierte Zystitis, ambulante Behandlung", "blocks": [{"type": "therapyTable", "columns": ["Erreger", "", "Therapie", "Standarddosierung", "Therapiedauer"], "rows": [{"cells": [{"text": "Empirisch\n(E. coli, K. pneumoniae, Proteus spp. zu erwarten)", "rowspan": 3}, {"text": "1. Wahl"}, {"text": "Amoxicillin / Clavulansäure"}, {"text": "3 x 1 g p.o."}, {"text": "Empirische Therapie nur bis zum Vorliegen des Antibiogramms, danach Anpassung!\n\nInsgesamt für 7 Tage", "rowspan": 3}]}, {"cells": [{"text": "2. Wahl", "rowspan": 2}, {"text": "Trimethoprim / Sulfamethoxazol bzw. Sulfametrol"}, {"text": "2 x 800 / 160 mg p.o."}]}, {"cells": [{"text": "Ciprofloxacin"}, {"text": "2 x 500 mg p.o."}]}]}]}, {"id": "kap11-2-3", "number": "11.2.3", "title": "Komplizierte Zystitis, stationäre Behandlung", "blocks": [{"type": "therapyTable", "columns": ["Erreger", "", "Therapie", "Standarddosierung", "Therapiedauer"], "rows": [{"cells": [{"text": "Empirisch\n(E. coli, K. pneumoniae, Proteus spp. zu erwarten)"}, {"text": "1. Wahl"}, {"text": "Cefotaxim"}, {"text": "3 x 2 g i.v."}, {"text": "Empirische Therapie nur bis zum Vorliegen des Antibiogramms, danach Anpassung!\n\nInsgesamt für 7 Tage"}]}]}, {"type": "footnotes", "items": [{"marker": "•", "text": "Komplizierende Faktoren: Anatomische/funktionelle Störung des Harnabflusses, Fremdkörper oder Steine im Harntrakt, Immunsuppression."}, {"marker": "•", "text": "Bei St. p. Nierentransplantierten wird ein nephrologisches Konsil empfohlen."}, {"marker": "•", "text": "Bei Fremdkörpern (außer Blasenkatheter) oder Harnabflussstörungen wird ein urologisches Konsil empfohlen."}]}]}]}, {"id": "kap11-4", "chapter": "11.4", "title": "Urosepsis (mit Organdysfunktion)", "sections": [{"id": "kap11-4-diagnostik", "number": null, "title": "Diagnostische Empfehlungen/ Erforderliche Diagnostik", "blocks": [{"type": "bullets", "items": ["Durchsicht und Beachtung mikrobiologischer Vorbefunden (Harn!), insbesondere hinsichtlich resistenter Erreger.", "Rascher Ausschluss einer obstruktiven Uropathie.", "Blutkulturen (2x aerobe und 2x anaerobe BK-Flaschen à 10ml) sowie Harnkultur vor Start der Therapie. Die Diagnostik sollte die Therapie jedoch nicht verzögern."]}]}, {"id": "kap11-4-therapeutisch", "number": null, "title": "Therapeutische Empfehlungen", "blocks": [{"type": "bullets", "items": ["Folgende Empfehlungen sind nur gültig für Patient*innen mit tatsächlicher Sepsis. Für Pyelonephritis ohne Sepsis siehe dort!", "Therapie innerhalb der ersten Stunde nach Abnahme der mikrobiologischen Diagnostik (Blut, Harn)", "Ggfs. umgehende Behebung der Obstruktion bzw. Herstellung einer Ableitung"]}, {"type": "therapyTable", "columns": ["Erreger", "", "Therapie", "Standarddosierung", "Therapiedauer"], "rows": [{"cells": [{"text": "Empirisch"}, {"text": "1. Wahl"}, {"text": "Meropenem"}, {"text": "3 x 2 g i.v. ①"}, {"text": "Siehe spezifische Erreger;\nDeeskalation sobald ein Antibiogramm vorliegt!"}]}, {"cells": [{"text": "E. coli, K. pneumoniae, Proteus spp.", "rowspan": 3}, {"text": "1. Wahl"}, {"text": "Cefotaxim"}, {"text": "3 x 2 g i.v. ①"}, {"text": "7 Tage", "rowspan": 3}]}, {"cells": [{"text": "2. Wahl (falls ESBL bzw. Reserve bei Resistenz gegen Cefotaxim)", "rowspan": 2}, {"text": "Meropenem"}, {"text": "3 x 2 g i.v. ①"}]}, {"cells": [{"text": "Ertapenem"}, {"text": "1 x 2 g i.v. ①"}]}, {"cells": [{"text": "Pseudomonas spp.", "rowspan": 3}, {"text": "1. Wahl", "rowspan": 3}, {"text": "Ceftazidim"}, {"text": "3 x 2 g i.v."}, {"text": "10 Tage", "rowspan": 3}]}, {"cells": [{"text": "Cefepim ②"}, {"text": "3 x 2g i.v. über 4 Stunden\nErste Dosis als KI"}]}, {"cells": [{"text": "Piperacillin / Tazobactam"}, {"text": "4 x 4,5g i.v. über 3 Stunden\nErste Dosis als KI"}]}, {"cells": [{"text": "E. aerogenes, E. cloacae Komplex, C. freundii Komplex, S. marcescens, H. alvei, Providencia spp.", "rowspan": 2}, {"text": "1. Wahl"}, {"text": "Cefepim ②"}, {"text": "3 x 2 g i.v."}, {"text": "7 Tage", "rowspan": 2}]}, {"cells": [{"text": "2. Wahl"}, {"text": "Rücksprache mit Infektionsdienst"}, {"text": "", "missing": true}]}]}, {"type": "footnotes", "items": [{"marker": "①", "text": "Erst nach 24 h an ggf. eingeschränkte Nierenfunktion anpassen."}, {"marker": "②", "text": "Nicht bei Patient*innen mit einer GFR <30 oder bekannter Epilepsie"}]}]}]}, {"id": "kap12", "chapter": "12", "title": "Erysipel", "sections": [{"id": "kap12-diagnostik", "number": null, "title": "Diagnostische Empfehlungen/ Erforderliche Diagnostik", "blocks": [{"type": "bullets", "items": ["Bei systemischen Infektionszeichen (Fieber) Blutkulturen (2x aerobe und 2x anaerobe BK-Flaschen à 10ml)."]}]}, {"id": "kap12-therapeutisch", "number": null, "title": "Therapeutische Empfehlungen", "blocks": [{"type": "bullets", "items": ["Behandlung der Eintrittspforte unbedingt erforderlich (z.B. Tinea pedis zwischen den Zehen), sonst Rezidivgefahr!"]}]}, {"id": "kap12-1", "number": "1", "title": "Unkompliziertes Erysipel, orale Therapie bei ansonsten gesunden Erwachsenen ausreichend", "blocks": [{"type": "therapyTable", "columns": ["Erreger", "", "Therapie", "Dosierung", "Therapiedauer"], "rows": [{"cells": [{"text": "Streptokokken (meist Gruppe A, Streptococcus pyogenes)", "rowspan": 4}, {"text": "1. Wahl", "rowspan": 2}, {"text": "Amoxicillin"}, {"text": "3 x 1g p.o."}, {"text": "Mind. 7 Tage, in der Regel 10 Tage (2 Tage über den Rückgang der klinischen Symptome hinaus)", "rowspan": 4}]}, {"separatorBefore": "oder", "cells": [{"text": "Phenoxymethylpenicillin"}, {"text": "3 x 1,5 Mio. I.E. p.o."}]}, {"cells": [{"text": "2. Wahl", "rowspan": 2}, {"text": "Cefalexin"}, {"text": "3 x 1g p.o."}]}, {"separatorBefore": "oder", "cells": [{"text": "Clindamycin\n(Penicillinallergie)"}, {"text": "3 x 600 mg p.o"}]}]}]}, {"id": "kap12-2", "number": "2", "title": "Kompliziertes Erysipel", "blocks": [{"type": "paragraph", "text": "Hämorrhagisch, nekrotisierend, blasig und/oder ausgeprägte Entzündung sowie Lokalisation im Gesicht, venöse oder arterielle Durchblutungsstörung, gastrointestinale Resorptionsstörungen -> Parenterale Therapie. Relative Indikation für parenterale Therapie: hohe laborchemische Entzündungszeichen, Fieber, deutliche AZ-Minderung. Nach etwa 5 bis 7 Tagen kann bei deutlicher Besserung eine Oralisierung mit Penicillin V oder Cefalexin (3 x 1 g) vorgenommen werden. Bei fehlenden Kontraindikationen frühzeitig Kompressionstherapie beginnen."}, {"type": "therapyTable", "columns": ["Erreger", "", "Therapie", "Dosierung", "Therapiedauer"], "rows": [{"cells": [{"text": "Streptokokken (meist Gruppe A, Streptococcus pyogenes)", "rowspan": 3}, {"text": "1. Wahl"}, {"text": "Penicillin G\n(Bei Besserung Oralisierung siehe 12.1.)"}, {"text": "3 x (5-)10 Mio IE i.v (die niedrige Dosis nur bei eingeschränkter Nierenfunktion)"}, {"text": "Mind. 10 Tage\n(2 Tage über den Rückgang der klinischen Symptome hinaus)", "rowspan": 3}]}, {"cells": [{"text": "Alternative", "rowspan": 2}, {"text": "Cefazolin①\n(Penicillinallergie)"}, {"text": "3 x 2g i.v."}]}, {"separatorBefore": "oder", "cells": [{"text": "Clindamycin"}, {"text": "3 x 1200 mg i.v."}]}]}, {"type": "footnotes", "items": [{"marker": "①", "text": "Auf Grund der einzigartigen Seitenketten von Cefazolin kann dieses auch bei Penicillin-Allergie gegeben werden, mit Ausnahme bei spezifischer Allergie gegen Cefazolin oder schwerer verzögerter Hypersensitivitätsreaktion (Nephritis, Drug Rash with Eosinophilia and Systemic Symptoms (DRESS), Serumkrankheit oder schwere Hautreaktionen wie Toxische epidermale Nekrolyse (TEN), Stevens-Johnson Syndrom (SJS), akute generalisierte exanthematöse Pustulose (AGEP), Purpura/Vaskulitis)."}]}]}, {"id": "kap12-3", "number": "3", "title": "Prophylaxe", "blocks": [{"type": "paragraph", "text": "Rezidiv-Prophylaxe nach 3–4 Rezidiven pro Jahr empfohlen, bei kritischen Patienten (z.B. mit Implantaten) ev. schon nach dem ersten Rezidiv."}, {"type": "therapyTable", "columns": ["Erreger", "Therapie", "Dosierung", "Therapiedauer"], "rows": [{"cells": [{"text": "Streptokokken, meist der Gruppe A (Streptococcus pyogenes), seltener durch B-, C-, G-Streptokokken", "rowspan": 3}, {"text": "Penicillin V"}, {"text": "2 x 1 Mio IE p.o."}, {"text": "Bis zu 12 Monate", "rowspan": 3}]}, {"cells": [{"text": "Benzylpenicillin Benzathin i.m"}, {"text": "2,4 Mio. IE i.m. alle 4 Wochen, bei erneutem Rezidiv häufiger, i.e. alle 2 Wochen, bei Rezidivfreiheit Intervall verlängerbar auf alle 4 Wochen"}]}, {"cells": [{"text": "Cefalexin"}, {"text": "2 x 1g p.o. für 6–12 Monate"}]}]}, {"type": "paragraph", "text": "Bei Nicht-Ansprechen -> Rücksprache mit dem Infektdienst!"}]}]}, {"id": "kap13", "chapter": "13", "title": "Furunkel, Karbunkel, Abszess", "sections": [{"id": "kap13-diagnostik", "number": null, "title": "Diagnostische Empfehlungen/ Erforderliche Diagnostik", "blocks": [{"type": "bullets", "items": ["Direktes Probenmaterial (Aspirate, Punktate, Gewebe …) ist Abstrichen vorzuziehen.", "Bei multiplen Abszessen oder Rezidiven Staph. Aureus/MRSA Screening empfohlen."]}]}, {"id": "kap13-therapeutisch", "number": null, "title": "Therapeutische Empfehlungen", "blocks": [{"type": "bullets", "items": ["Primär chirurgische Versorgung, Inzision und Drainage. Antibiotische Therapie nur bei ausgeprägtem Lokalbefund, systemischen Infektzeichen (Fieber, Tachykardie etc.), Lokalisation im Gesicht, an den Händen oder im Genitoanalbereich. Erregernachweis mittels Probenentnahme für Mikrobiologie unbedingt empfohlen."]}, {"type": "therapyTable", "columns": ["Erreger", "", "Therapie", "Dosierung", "Therapiedauer"], "rows": [{"cells": [{"text": "Empirische Therapie bzw. Staph. aureus MSSA", "rowspan": 2}, {"text": "1. Wahl"}, {"text": "Cefazolin\noder\nCefalexin"}, {"text": "3 x 2 g i.v.\n\n3 x 1g p.o."}, {"text": "5 Tage"}]}, {"cells": [{"text": "Alternative"}, {"text": "Cefazolin①\n(Penicillinallergie)\noder\nClindamycin\n(bei Cefazolin- Allergie)"}, {"text": "3 x 2g i.v.\n\n3 x 600 mg p.o."}, {"text": "", "missing": true}]}]}, {"type": "therapyTable", "columns": ["Erreger", "", "Therapie", "Dosierung", "Therapiedauer"], "rows": [{"cells": [{"text": "Staph. Aureus MRSA", "rowspan": 2}, {"text": "1. Wahl"}, {"text": "Daptomycin③\noder\nLinezolid"}, {"text": "1 x 10-12mg/kg i.v.\n\n2 x 600mg p.o."}, {"text": "5 Tage", "rowspan": 4}]}, {"cells": [{"text": "additiv"}, {"text": "ev. in Kombination mit Fosfomycin④"}, {"text": "3 x 4g i.v."}]}, {"cells": [{"text": "Infektion mit Anaerobieren oder gramneg. Erregern wahrscheinlich②\noder Lokalisation im Gesicht", "rowspan": 2}, {"text": "1. Wahl"}, {"text": "Ampicillin/Sulbactam\noder\nAmoxicillin/Clavulansäure"}, {"text": "3 x 3g i.v.\n\n3 x 1g p.o."}]}, {"cells": [{"text": "Alternative"}, {"text": "Moxifloxacin⑤\n(Penicillinallergie)"}, {"text": "1 x 400mg p.o."}]}]}, {"type": "footnotes", "items": [{"marker": "①", "text": "Auf Grund der einzigartigen Seitenketten von Cefazolin kann dieses auch bei Penicillin-Allergie gegeben werden, mit Ausnahme bei spezifischer Allergie gegen Cefazolin oder schwerer verzögerter Hypersensitivitätsreaktion (Nephritis, Drug Rash with Eosinophilia and Systemic Symptoms (DRESS), Serumkrankheit oder schwere Hautreaktionen wie Toxische epidermale Nekrolyse (TEN), Stevens-Johnson Syndrom (SJS), akute generalisierte exanthematöse Pustulose (AGEP), Purpura/Vaskulitis)."}, {"marker": "②", "text": "z.B. bei penetrierenden Traumata mit kontaminierten Gegenständen, bakterienreiche Areale, Wundinfektionen nach OPs im Bereich der Axilla, des Darmes, der Perianalgegend oder Genitaltrakt."}, {"marker": "", "text": "Auf Grund der einzigartigen Seitenketten von Cefazolin kann dieses auch bei Penicillin-Allergie gegeben werden, mit Ausnahme bei spezifischer Allergie gegen Cefazolin oder schwerer verzögerter Hypersensitivitätsreaktion (Nephritis, Drug Rash with Eosinophilia and Systemic Symptoms (DRESS), Serumkrankheit oder schwere Hautreaktionen wie Toxische epidermale Nekrolyse (TEN), Stevens-Johnson Syndrom (SJS), akute generalisierte exanthematöse Pustulose (AGEP), Purpura/Vaskulitis)."}, {"marker": "③", "text": "Eosinophile und Kreatinphosphokinase (CK) Kontrolle 2x/ Woche"}, {"marker": "④", "text": "CAVE hoher Natriumgehalt ( > 8g Fosfomycin/d: > 2g Na+/d), relevantes Monitoring: Na+, K+!", "warning": true}, {"marker": "⑤", "text": "QTc-Zeit und Risikofaktoren für Torsades de pointes beachten."}]}, {"type": "paragraph", "text": "Bei Nicht-Ansprechen -> Rücksprache mit dem Infektdienst!"}]}]}, {"id": "kap14", "chapter": "14", "title": "Infektionen chronischer Wunden und diabetischer Fuß mit Infektion", "sections": [{"id": "kap14-diagnostik", "number": null, "title": "Diagnostische Empfehlungen/ Erforderliche Diagnostik", "blocks": [{"type": "bullets", "items": ["Zur mikrobiologischen Diagnostik sind Punktate oder Gewebebiopsien oberflächlichen Wundabstrichen immer vorzuziehen.", "Bei systemischen Entzündungszeichen, insbesondere Fieber, sollten zusätzlich immer auch Blutkulturen (mind. 2x aerob + 2x anaerob) eingeschickt werden."]}]}, {"id": "kap14-therapeutisch", "number": null, "title": "Therapeutische Empfehlungen", "blocks": [{"type": "bullets", "items": ["Indikationen für eine parenterale Antibiotika-Therapie sind"], "subBullets": {"afterItem": 0, "items": ["Schwere Infektion mit ausgeprägten systemischen Zeichen oder mit Zeichen einer beginnenden Sepsis", "Kritische Lokalisation mit dem Risiko gravierender Folgen (z.B. Hand oder Gesichtsbereich)", "Vorliegen entsprechender Komorbiditäten (z.B. Durchblutungsstörung, gastrointestinale Resportionsstörung)", "Relevante Immunsuppression"]}}]}, {"id": "kap14-1", "number": "1", "title": "Begrenzte Phlegmone (z.B. bei chronischen Wunden)", "blocks": [{"type": "paragraph", "text": "I.e. eine teilweise eitrige Infektion der Dermis und Subkutis, jedoch kein Erysipel oder eitrig-nekrotische, bis an die Faszie reichende Infektion. In der Regel ist keine chirurgische Versorgung notwendig. Klinisch zeigt sich eine überwärmte, ödematöse, schmerzhafte, dunkle oder livide Rötung bzw. teigige Schwellung um eine Eintrittspforte (Ulkus, Wunde) herum. Verantwortlicher Erreger bei immunkompetenten Patienten ist meistens Staphylococcus aureus, selbst wenn die Eintrittspforte multibakteriell besiedelt oder mit anderen Erregern infiziert ist. Anfänglich fehlen systemische Infektionszeichen wie Leukozytose mit Neutrophilie, Fieber oder CRP Anstieg. Eine Probenentnahme für die mikrobiologische Diagnostik und eine gezielte Therapie nach Antibiogramm wird empfohlen. Bei fehlendem Ansprechen nach 2-3 Tagen ist wie bei „schwerer Phlegmone“ weiterzubehandeln."}, {"type": "therapyTable", "columns": ["Erreger", "", "Therapie", "Standarddosierung", "Therapiedauer"], "rows": [{"cells": [{"text": "Empirische Therapie", "rowspan": 3}, {"text": "1. Wahl"}, {"text": "Cefalexin"}, {"text": "3 x 1 g p.o."}, {"text": "7 Tage\n(ohne Osteomyelitis)", "rowspan": 5}]}, {"cells": [{"text": "1. Wahl bei Indikation für parenterale Therapie"}, {"text": "Cefazolin ①"}, {"text": "3 x 2 g i.v."}]}, {"cells": [{"text": "2. Wahl"}, {"text": "Amoxicillin / Clavulansäure"}, {"text": "3 x 1 g p.o."}]}, {"cells": [{"text": "Methicillin-resistenter S. aureus (MRSA)", "rowspan": 2}, {"text": "1. Wahl, nach Antibiogramm"}, {"text": "Clindamycin"}, {"text": "3 x 1,2 g i.v. oder 3 x 600 mg p.o."}]}, {"cells": [{"text": "2. Wahl, nach Antibiogramm"}, {"text": "Linezolid"}, {"text": "2 x 600 mg i.v. oder p.o."}]}]}, {"type": "footnotes", "items": [{"marker": "①", "text": "Auf Grund der einzigartigen Seitenketten von Cefazolin kann dieses auch bei Penicillin-Allergie gegeben werden, mit Ausnahme bei spezifischer Allergie gegen Cefazolin oder schwerer verzögerter Hypersensitivitätsreaktion (Nephritis, Drug Rash with Eosinophilia and Systemic Symptoms (DRESS), Serumkrankheit oder schwere Hautreaktionen wie Toxische epidermale Nekrolyse (TEN), Stevens-Johnson Syndrom (SJS), akute generalisierte exanthematöse Pustulose (AGEP), Purpura/Vaskulitis)."}]}]}, {"id": "kap14-2", "number": "2", "title": "Schwere Phlegmone / begrenzte Phlegmone der Leisten- oder Anogenitalregion", "blocks": [{"type": "paragraph", "text": "Entspricht in der klinischen Manifestation der begrenzten Phlegmone, jedoch unter Umständen bereits Nekrosen sowie tiefer gelegene Anteile der Weichteile wie Faszien mitbetroffen. Es treten meist auch eine regionale Lymphadenitis, starke Schmerzen und Fieber auf. Auch eine „begrenzte Phlegmone“ ohne Ansprechen auf obige Therapie nach 2-3 Tagen ist wie eine „schwere Phlegmone“ zu behandeln. Eine sorgfältige Probengewinnung (Aspirat, Biopsie, tiefer Abstrich; oberflächlicher Abstrich nur falls keine höherwertiges Probenmaterial möglich) ist in Kombination mit Blutkulturen anzustreben. Essentiell ist die gleichzeitige chirurgische Sanierung!"}, {"type": "therapyTable", "columns": ["Erreger", "", "Therapie", "Standarddosierung", "Therapiedauer"], "rows": [{"cells": [{"text": "Empirische Therapie", "rowspan": 2}, {"text": "1. Wahl"}, {"text": "Ampicillin / Sulbactam"}, {"text": "3 x 3 g i.v."}, {"text": "10 Tage\n(ohne Osteomyelitis)", "rowspan": 5}]}, {"cells": [{"text": "2. Wahl\n(Penicillinallergie)"}, {"text": "Moxifloxacin"}, {"text": "1 x 400 mg i.v./p.o."}]}, {"cells": [{"text": "Methicillin-empfindlicher S. aureus (MSSA)"}, {"text": "1. Wahl"}, {"text": "Cefazolin ①"}, {"text": "3 x 2 g i.v."}]}, {"cells": [{"text": "Methicillin-resistenter S. aureus (MRSA)", "rowspan": 2}, {"text": "1. Wahl, nach Antibiogramm"}, {"text": "Clindamycin"}, {"text": "3 x 1,2 g i.v."}]}, {"cells": [{"text": "2. Wahl, nach Antibiogramm"}, {"text": "Linezolid"}, {"text": "2 x 600 mg i.v. oder p.o."}]}]}, {"type": "footnotes", "items": [{"marker": "①", "text": "Auf Grund der einzigartigen Seitenketten von Cefazolin kann dieses auch bei Penicillin-Allergie gegeben werden, mit Ausnahme bei spezifischer Allergie gegen Cefazolin oder schwerer verzögerter Hypersensitivitätsreaktion (Nephritis, Drug Rash with Eosinophilia and Systemic Symptoms (DRESS), Serumkrankheit oder schwere Hautreaktionen wie Toxische epidermale Nekrolyse (TEN), Stevens-Johnson Syndrom (SJS), akute generalisierte exanthematöse Pustulose (AGEP), Purpura/Vaskulitis)."}]}]}, {"id": "kap14-3", "number": "3", "title": "Schwerer Haut- und Weichteilinfekt (nosokomiale Genese, Sepsis, Organdysfunktion, Neutropenie, andere Form der tiefen Immunsuppression)", "blocks": [{"type": "paragraph", "text": "Eine sorgfältige Probengewinnung (Aspirat, Biopsie, tiefer Abstrich; oberflächlicher Abstrich nur falls keine höherwertiges Probenmaterial möglich) ist in Kombination mit Blutkulturen (mind. 2x aerob und 2x anaerob) unerlässlich. Essenziell ist die gleichzeitige chirurgische Sanierung!"}, {"type": "therapyTable", "columns": ["Erreger", "", "Therapie", "Standarddosierung", "Therapiedauer"], "rows": [{"cells": [{"text": "Mischinfektion\n(S. aureus MSSA, gramnegative Erreger, Anaerobier)", "rowspan": 4}, {"text": "1. Wahl", "rowspan": 3}, {"text": "Piperacillin / Tazobactam"}, {"text": "4 x 4,5 g i.v. über 3 Stunden"}, {"text": "10 Tage\n(ohne Osteomyelitis)", "rowspan": 4}]}, {"cells": [{"text": "Meropenem"}, {"text": "3 x 2 g i.v."}]}, {"cells": [{"text": "Cefepim ②\n+\nMetronidazol"}, {"text": "3 x 2 g i.v. über 4 Stunden\n+\n3 x 500 mg i.v."}]}, {"cells": [{"text": "2. Wahl"}, {"text": "Tigecyclin"}, {"text": "1 x 200 mg i.v. an Tag 1, dann 2 x 100 mg i.v."}]}]}, {"type": "footnotes", "items": [{"marker": "②", "text": "Nierenfunktion beachten, bei neurotoxischen Symptomen absetzen"}]}]}, {"id": "kap14-4", "number": "4", "title": "Haut- und Weichteilinfektionen mit speziellen Erregern", "blocks": [{"type": "therapyTable", "columns": ["Erreger", "", "Therapie", "Standarddosierung", "Therapiedauer"], "rows": [{"cells": [{"text": "Aeromonas hydrophila\n(Traumata mit Süsswasserexposition)", "rowspan": 2}, {"text": "1. Wahl ambulant"}, {"text": "Doxycyclin\n+\nCeftriaxon"}, {"text": "2 x 100 mg p.o.\n+\n1 x 4 g i.v."}, {"text": "10 Tage\n(ohne Osteomyelitis)"}]}, {"cells": [{"text": "1. Wahl stationär"}, {"text": "Doxycyclin\n+\nCefotaxim"}, {"text": "2 x 100 mg i.v.\n+\n3 x 2 g i.v."}, {"text": "10 Tage\n(ohne Osteomyelitis)"}]}, {"cells": [{"text": "Vibrio spp.\n(Traumata mit Salzwasserexposition)", "rowspan": 2}, {"text": "1. Wahl ambulant"}, {"text": "Doxycyclin\n+\nCeftriaxon"}, {"text": "2 x 100 mg p.o.\n+\n1 x 4 g i.v."}, {"text": "10 Tage\n(ohne Osteomyelitis)"}]}, {"cells": [{"text": "1. Wahl stationär"}, {"text": "Doxycyclin\n+\nCefotaxim"}, {"text": "2 x 100 mg i.v.\n+\n3 x 2 g i.v."}, {"text": "10 Tage\n(ohne Osteomyelitis)"}]}]}]}]}, {"id": "kap17", "chapter": "17", "title": "Nekrotisierende Fasziitis", "sections": [{"id": "kap17-diagnostik", "number": null, "title": "Diagnostische Empfehlungen/ Erforderliche Diagnostik", "blocks": [{"type": "bullets", "items": ["Die Diagnose wird durch die niederschwellige chirurgische Exploration gestellt! Bildgebung ist sekundär und sollte keinesfalls die chirurgische Exploration verzögern.", "Intraoperative Gewebeproben und Flüssigkeiten sollten zur mikrobiologischen Diagnostik eingesandt werden (idealerweise Gewebe / Flüssigkeit und keine Abstriche!)", "Bei Blutabnahme im Labor CK und Myoglobin mitbestimmen lassen."]}]}, {"id": "kap17-therapeutisch", "number": null, "title": "Therapeutische Empfehlungen", "blocks": [{"type": "bullets", "warning": true, "items": ["Die nekrotisierende Fasziitis ist ein chirurgischer Notfall! Die frühzeitige chirurgische Exploration und aggressives Debridement sind essentiell für die Überlebenschance!"]}]}, {"id": "kap17-17-1", "number": "17.1", "title": "Empirische Therapie der nekrotisierenden Fasziitis", "blocks": [{"type": "therapyTable", "columns": ["Erreger", "", "Therapie", "Dosierung", "Therapiedauer"], "rows": [{"cells": [{"text": "Empirisch", "rowspan": 2}, {"text": "1. Wahl"}, {"text": "Meropenem\n+\nClindamycin ①"}, {"text": "3 x 2 g i.v.\n+\n3 x 900 mg i.v."}, {"text": "Siehe spezifische Erreger", "rowspan": 2}]}, {"cells": [{"text": "Alternative"}, {"text": "Cefepim\n+\nClindamycin ①\n+\nMetronidazol"}, {"text": "3 x 2 g i.v.\n+\n3 x 900 mg i.v.\n+\n1 x 1500 mg i.v."}]}]}, {"type": "footnotes", "items": [{"marker": "①", "text": "Bis zur hämodynamischen Stabilisierung (3-5 Tage), danach absetzen"}]}]}, {"id": "kap17-17-2", "number": "17.2", "title": "Gezielte Therapie der nekrotisierenden Fasziitis", "blocks": [{"type": "therapyTable", "columns": ["Erreger", "", "Therapie", "Dosierung", "Therapiedauer"], "rows": [{"cells": [{"text": "Gruppe A Streptokokken (S. pyogenes) - Monoinfektion"}, {"text": "1. Wahl"}, {"text": "Penicillin G\n+\nClindamycin ①\n+\nIVIG"}, {"text": "6 x 5 Mio. IE i.v.\n+\n3 x 900 mg i.v.\n+\nTag 1: 1 g/kg,\nTag 2+3: 0,5 g/kg"}, {"text": "mind. 2 Wochen\n(mind. bis kein Debridement mehr nötig)", "rowspan": 6}]}, {"cells": [{"text": "S. aureus (MSSA) - Monoinfektion"}, {"text": "1. Wahl"}, {"text": "Cefazolin\n+\nClindamycin ①"}, {"text": "3 x 3 g i.v.\n+\n3 x 900 mg i.v."}]}, {"cells": [{"text": "S. aureus (MRSA) - Monoinfektion"}, {"text": "1. Wahl"}, {"text": "Linezolid"}, {"text": "2 x 600mg i.v."}]}, {"cells": [{"text": "Clostridium perfringens /Clostridium septicum / C. sordellii - Monoinfektion"}, {"text": "1. Wahl"}, {"text": "Penicillin G\n+\nClindamycin ①"}, {"text": "3 x 10 Mio. Einheiten i.v.\n+\n3 x 900 mg i.v."}]}, {"cells": [{"text": "Aeromonas spp. - Monoinfektion\n(Risiko: Süßwasserexposition)"}, {"text": "1. Wahl"}, {"text": "Cefotaxim\n+\nDoxycyclin"}, {"text": "3 x 3 g i.v.\n+\n2 x 100 mg i.v."}]}, {"cells": [{"text": "Vibrio vulnificus - Monoinfektion\n(Risiko: Salzwasserexposition)"}, {"text": "1. Wahl"}, {"text": "Cefotaxim\n+\nDoxycyclin"}, {"text": "3 x 3 g i.v.\n+\n2 x 100 mg i.v."}]}]}, {"type": "footnotes", "items": [{"marker": "①", "text": "Bis zur hämodynamischen Stabilisierung (3-5 Tage), danach absetzen"}]}]}]}, {"id": "kap18", "chapter": "18", "title": "Interpretation von Antibiogrammen", "sections": [{"id": "kap18-tabelle", "number": null, "title": "Interpretation von Antibiogrammen", "blocks": [{"type": "table", "columns": ["Kategorie", "Definition", "Erklärung"], "rows": [{"cells": [{"text": "S bzw. +"}, {"text": "Empfindlich (“susceptible”), Standarddosierungsschema"}, {"text": "Ein Mikroorganismus wird als „empfindlich, Standard-Dosierungsschema“ eingestuft, wenn eine hohe Wahrscheinlichkeit für einen therapeutischen Erfolg bei Verwendung eines Standard-Dosierungsschemas des jeweiligen Wirkstoffs besteht."}]}, {"cells": [{"text": "I bzw. +/-"}, {"text": "Empfindlich (“susceptible”), erhöhtes Dosierungsschema"}, {"text": "Ein Mikroorganismus wird als „empfindlich, erhöhte Exposition“ eingestuft, wenn eine hohe Wahrscheinlichkeit für einen therapeutischen Erfolg besteht, falls die Exposition gegenüber dem jeweiligen Wirkstoff durch eine Anpassung des Dosierungsschemas oder durch seine Konzentration am Ort der Infektion erhöht wird. Es handelt sich explizit nicht um eine „intermediäre“ Resistenz!"}]}, {"cells": [{"text": "R bzw. -"}, {"text": "Resistent"}, {"text": "Ein Mikroorganismus wird als „resistent“ eingestuft, wenn die Wahrscheinlichkeit eines Therapieversagens auch bei erhöhter Exposition hoch i /* ---------- Zahlen ---------- */
const parseNum=s=>{const v=parseFloat(String(s).replace(",",".").replace(/[^\d.\-]/g,""));return isFinite(v)?v:NaN};
function fmt(v,maxd){ if(!isFinite(v))return "–"; let d=maxd!=null?maxd:(Math.abs(v)>=100?0:Math.abs(v)>=10?1:Math.abs(v)>=1?1:2);
  let s=(Math.round(v*Math.pow(10,d))/Math.pow(10,d)).toFixed(d); if(d>0)s=s.replace(/0+$/,"").replace(/\.$/,""); return s.replace(".",","); }
function getKg(){const v=store.get("kg",null);return v&&v>0?v:null}
function setKg(v){store.set("kg",v>0?v:null)}

/* Dosis ↔ ml/h. ml/h = Dosis × (kg) × m / c */
function toRate(c,dose,kg){ if(c.w&&!kg)return NaN; return dose*(c.w?kg:1)*(c.m||1)/c.cc; }
function toDose(c,rate,kg){ if(c.w&&!kg)return NaN; return rate*c.cc/((c.w?kg:1)*(c.m||1)); }
function calcOf(d){ if(!d.calc)return null; const c=Object.assign({},d.calc); const opt=store.get("conc."+d.id,0);
  if(c.co){const o=c.co[Math.min(opt,c.co.length-1)];c.cc=o[1];c.cl=o[0];} else c.cc=c.c; return c; }
function rateRange(c,arr,kg){ if(!arr||!arr.length)return ""; const r=arr.map(x=>toRate(c,x,kg)); if(r.some(x=>!isFinite(x)))return "";
  return r.length>1?fmt(r[0])+"–"+fmt(r[1]):fmt(r[0]); }

/* ---------- Text-Rendering ---------- */
function rich(s){
  let h=esc(s);
  h=h.replace(/\[\[([^\]]+)\]\]/g,(m,n)=>phoneBtn(n));
  h=h.replace(/\b(CAVE|Cave|cave)\b(:?)/g,'<mark class="w">$1$2</mark>');
  h=h.replace(/(KI:)/g,'<mark class="w">$1</mark>');
  return h;
}
function richNotes(s){ // Notizen im Telefonbuch: Nummern antippbar
  return esc(s).replace(/\b(81-\d{4}|\d{5})\b/g,(m)=>phoneBtn(m));
}
function phoneBtn(v,label){
  const ext=/^(0|\+)/.test(v.trim()); const pg=/^81-\d{4}$/.test(v.trim()); if(pg&&label==="Pager")label="";
  return '<button class="ph'+(pg?' pg':'')+'" type="button" data-copy="'+esc(v)+'" aria-label="'+(pg?'Pager ':'')+esc(v)+' kopieren">'+(pg?'<span class="pgl">Pager</span> ':'')+esc(v)+(label?' <small>'+esc(label)+'</small>':"")+'</button>'+
    (ext?'<a class="callx" href="tel:'+esc(v.replace(/[^\d+]/g,""))+'" aria-label="anrufen">☎</a>':"");
}
function renderBlocks(blocks,ctx){
  return blocks.map(b=>{
    if(b.h!=null) return '<h3'+(b.hw?' class="w"':'')+'>'+rich(b.h)+'</h3>';
    if(b.p!=null) return '<p>'+rich(b.p)+'</p>';
    if(b.ul) return renderList(b.ul,"ul");
    if(b.ol) return renderList(b.ol,"ol");
    if(b.dl) return '<dl class="ddl">'+b.dl.map(r=>'<dt>'+rich(r[0])+'</dt><dd>'+rich(r[1])+'</dd>').join("")+'</dl>';
    if(b.tbl) return '<div class="tbl"><table><thead><tr>'+b.tbl[0].map(c=>'<th scope="col">'+esc(c)+'</th>').join("")+'</tr></thead><tbody>'+
      b.tbl.slice(1).map(r=>'<tr>'+r.map((c,i)=>i?'<td>'+rich(c)+'</td>':'<th scope="row">'+esc(c)+'</th>').join("")+'</tr>').join("")+'</tbody></table></div>';
    if(b.link) return '<a class="xref" href="'+esc(b.link[1])+'" target="_blank" rel="noopener">↗ '+esc(b.link[0])+'</a>';
    if(b.xref) return '<a class="xref" href="#'+(b.xref[0]==="sop"?"s-":"n-")+b.xref[1]+'">→ '+esc(b.xref[2])+'</a>';
    if(b.tool) return toolHTML(b.tool);
    return "";
  }).join("");

function wireTools(root){

    if(isFinite(K)&&isFinite(W)&&W>0){const d=(4.5-K)*W*0.4;o.innerHTML=fmt(d,0)+' mVal <small>Kaliumdefizit = (4.5 – '+fmt(K,2)+') × '+fmt(W,1)+' × 0.4</small>';}else o.textContent="–";};
    k.addEventListener("input",upd);root.querySelector("#t-kg").addEventListener("input",upd);upd();}
  const hk=root.querySelector("#t-hk");

      li.classList.toggle("on",on);});};
    hk.addEventListener("input",upd);
    root.querySelectorAll("[data-ekg]").forEach(b=>b.addEventListener("click",()=>{const v=+b.dataset.ekg;ekg=ekg===v?null:v;root.querySelectorAll("[data-ekg]").forEach(x=>x.setAttribute("aria-pressed",String(ekg===+x.dataset.ekg)));upd();}));}
  const ik=root.querySelector("#t-ikg");
  if(ik){const upd=()=>{const W=parseNum(ik.value);const o=root.querySelector("#t-iout");
    if(isFinite(W)&&W>0){const mg=Math.min(W,100);o.innerHTML=fmt(mg,1)+' mg 1-0-1 s.c. <small>therapeutisch '+(W>100?'(Maximum 100 mg)':'1 mg/kg')+'</small>';}else o.textContent="–";};
    ik.addEventListener("input",upd);upd();}
}

function globalSearch(q){

const CALC_MEM={};
const isG=u=>/^[µμ]g\/kg\/min$/.test(u);
const dU=(d,v)=>fmt(v,3)+(isG(d.u)?" γ":" "+d.u);
function ladder(c){ // Start + n × Schritt (bis Max, sonst 3 Schritte); max. 8 Werte
  if(c.dbl&&c.s){const o=[];for(let v=c.s[0];v<=c.mx+1e-9;v*=2)o.push(v);return o;}
  if(!c.s||!c.st)return [];
  const out=[]; const lim=c.mx!=null?c.mx:c.s[0]+3*c.st;
  for(let v=c.s[0],i=0;v<=lim+1e-9&&i<60;i++,v=Math.round((v+c.st)*1e6)/1e6)out.push(v);
  if(c.mx!=null&&Math.abs(out[out.length-1]-c.mx)>1e-9)out.push(c.mx);
  if(out.length>8)return out.slice(0,7).concat([null,out[out.length-1]]);
  return out;
}

  const mlh=s=>s?'<b class="ml">'+esc(s)+'<small> ml/h</small></b>':(c&&c.w&&!kg?'<b class="ml mute">kg?</b>':'');
  // Referenzzeilen: Text aus dem Standard klein, ml/h groß
  const rows=[];
  if(d.dose!=null) rows.push({l:"Dosis",t:d.dose,u:d.u});

  if(d.dose!=null&&c&&c.s) rows.push({l:c.sl||"Start",t:c.s.map(x=>fmt(x,3)).join("–"),u:d.u,r:R(c.s),q:c.s[0]});
  if(c&&c.st) rows.push({l:"Schritt",t:"+"+(d.step&&d.dose==null?d.step:fmt(c.st,3)),u:d.u,r:"+"+R(c.st)});

    '<div class="dlab">Dosis</div><div class="crow"><input id="gd" inputmode="decimal" placeholder="Dosis" value="'+esc(st.d)+'" aria-label="Dosis"><select id="gdu" aria-label="Dosiseinheit">'+opt(DOSE_U.map(x=>x[0]).filter(x=>x!=="ml/h"),st.du)+'</select></div>'+
    '<div class="big" id="gbig" aria-live="polite"></div><div id="gmsg"></div>'+
    '<details class="rev"><summary>Umgekehrt: ml/h → Dosis</summary><div class="revrow"><input id="gr" inputmode="decimal" aria-label="ml/h"><span>ml/h =</span><b id="grd">–</b></div></details>'+
    '</div><p class="hint">Nur Rechenhilfe – Konzentration und Dosis selbst prüfen.</p>');
  const $a=$("#ga"),$au=$("#gau"),$v=$("#gv"),$d=$("#gd"),$du=$("#gdu"),$r=$("#gr");
  [$a,$au,$v,$d,$du,$r].forEach(x=>x.addEventListener("input",upd));
  function upd(){
    const s={a:$a.value,au:$au.value,v:$v.value,du:$du.value,d:$d.value}; store.set("calc",s);
    const a=parseNum(s.a),v=parseNum(s.v),d=parseNum(s.d),kg=getKg();
    const A=AMT_U[s.au]; const U=DOSE_U.find(x=>x[0]===s.du); const DU=AMT_U[U[1]];
    const big=$("#gbig"),msg=$("#gmsg"),gc=$("#gc"),grd=$("#grd"); let m="";
    if(!(a>0&&v>0)){gc.textContent="";big.innerHTML='<span class="mute">Menge und Volumen eingeben</span>';msg.innerHTML="";grd.textContent="–";return;}
    gc.textContent="= "+fmt(a/v,4)+" "+s.au+"/ml";
    if(A[0]!==DU[0]){big.innerHTML='<span class="mute">Einheiten passen nicht ('+esc(s.au)+' ↔ '+esc(s.du)+')</span>';msg.innerHTML="";grd.textContent="–";return;}
    const cc=a*A[1]/v/DU[1]; // Konzentration in Dosis-Einheit pro ml
    const c={cc:cc,w:U[2],m:U[3]};
    if(c.w&&!kg){big.innerHTML='<span class="mute">Gewicht oben eingeben</span>';document.querySelector("#top .kg")?.classList.add("ask");}
    else if(!(d>=0)){big.innerHTML='<span class="mute">Dosis eingeben</span>';}
    else{document.querySelector("#top .kg")?.classList.remove("ask");
      const r=toRate(c,d,kg);
      big.innerHTML='<span class="v">'+fmt(r)+'</span><span class="mlh">ml/h</span><span class="bd">'+fmt(d,3)+' '+esc(s.du)+'</span>';
      m+='<div class="formula">'+fmt(d,3)+' '+esc(s.du)+(c.w?' × '+fmt(kg,1)+' kg':'')+(c.m===60?' × 60':'')+' ÷ '+fmt(cc,4)+' '+esc(U[1])+'/ml</div>';
      if(r>0) m+='<div class="formula">Spritze ('+fmt(v,1)+' ml) reicht ca. <b>'+fmt(v/r,1)+' h</b> · Tagesmenge '+fmt(d*(c.w?kg:1)*c.m*24,2)+' '+esc(U[1])+'</div>';
    }
    if(c.w&&kg&&(kg<30||kg>250)) m+='<div class="warnbox"><b>Gewicht prüfen:</b> '+fmt(kg,1)+' kg</div>';
    msg.innerHTML=m;
    const rr=parseNum($r.value); const x=rr>=0?toDose(c,rr,kg):NaN; grd.textContent=isFinite(x)?fmt(x,3)+" "+s.du:"–";
  }
  upd();
}
