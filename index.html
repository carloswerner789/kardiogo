function abxRx(name){const parts=name.split("/").map(x=>norm(x).replace(/[.*+?^${}()|[\]\\]/g,"\\$&"));return new RegExp("(^|[^a-z])"+parts.join("\\s*/\\s*")+(parts.length===1?"(?!\\s*/)":"")+"([^a-z]|$)");}
let PAN_ABX=null;
function panAbx(){ if(PAN_ABX)return PAN_ABX;
  const out=[];
  PAN_ABX_NAMES.forEach(name=>{const rx=abxRx(name);const uses=[];let oral=null,res=[];
    PANTHER.documents.forEach(d=>d.sections.forEach(s=>s.blocks.forEach(b=>{
      if(b.type==="therapyTable"){const g=panGrid(b);b.rows.forEach((r,ri)=>{const row=g[ri]||[];if(row.some(x=>x&&x.origin&&x.cell.text&&rx.test(norm(x.cell.text))))uses.push({d,s,b,ri,g});});}
      if(b.type==="table"&&d.id==="kap20"){b.rows.forEach(r=>{if(rx.test(norm(r.cells[0].text)))oral={b,r};});}
      if(b.type==="resistanceTable"){b.columns.forEach((c,ci)=>{if(ci&&rx.test(norm(c)))b.rows.forEach(r=>res.push([r.organism,r.values[ci-1]]));});}
    })));
    if(uses.length||oral||res.length)out.push({name,id:slug(name),uses,oral,res});});

function ptxt(s){return rich(s).replace(/\n/g,"<br>");}
function panTable(b,kind){

  }).join("");
  return (b.tableTitle?'<h3>'+esc(b.tableTitle)+'</h3>':'')+'<div class="ptbl"><table><thead><tr>'+b.columns.map(c=>'<th scope="col">'+esc(c)+'</th>').join("")+'</tr></thead><tbody>'+rows+'</tbody></table></div>'+(b.highlightLegend?'<p class="legend"><span class="hlsw"></span>'+esc(b.highlightLegend)+'</p>':'');
}
function panGrid(b){ // rowspan/colspan auflösen
  const g=[];const n=b.columns.length;
  b.rows.forEach((r,ri)=>{g[ri]=g[ri]||[];let c=0;
    r.cells.forEach(cell=>{while(g[ri][c])c++;const rs=cell.rowspan||1,cs=cell.colspan||1;
      for(let i=0;i<rs;i++)for(let j=0;j<cs;j++){g[ri+i]=g[ri+i]||[];g[ri+i][c+j]={cell,origin:i===0&&j===0,cs};}
      c+=cs;});});
  return g;
}
function panCards(b){
  const g=panGrid(b);let h='<div class="pcards">';let open=false;
  b.rows.forEach((r,ri)=>{
    const row=g[ri]||[];
    if(r.separatorBefore) h+='<div class="pc-sep">'+esc(r.separatorBefore)+'</div>';
    const first=row[0];
    if(!open||(first&&first.origin)){ if(open)h+='</div>'; h+='<div class="pcard'+(r.highlight?' hl-'+esc(r.highlight):'')+'">'; open=true;
      if(first) h+='<div class="pc-h">'+(first.cell.missing?'–':ptxt(first.cell.text))+'</div>'; }
    let line='';
    for(let c=1;c<b.columns.length;c++){const x=row[c];if(!x||!x.origin)continue;const txt=x.cell.missing?'<i class="miss">nicht angegeben</i>':ptxt(x.cell.text);if(!x.cell.text&&!x.cell.missing)continue;
      const lab=b.columns[c];line+=lab?'<div class="pc-f"><span>'+esc(lab)+'</span><div>'+txt+'</div></div>':'<div class="pc-tag">'+txt+'</div>';}
    if(line) h+='<div class="pc-row">'+line+'</div>';
  });
  if(open)h+='</div>';
  return h+'</div>';
}
function panBlock(b){

// Telefon
function telHay(e){ if(!e._h){ const words=norm(e.c+" "+e.s+" "+e.n+" "+(e.a||"")+" "+e.note+" "+e.nums.map(n=>n.l&&n.l!=="DECT"?n.l:"").join(" "));
  e._h={w:" "+words.replace(/[^a-z0-9]+/g," ")+" ",d:e.nums.map(n=>n.v.replace(/\D/g,"")).join(" ")}; } return e._h; }
function telMatch(e,terms){ const h=telHay(e); return terms.every(t=>{ const tt=t.replace(/[^a-z0-9]/g,""); if(!tt)return true;
  if(/^\d+$/.test(tt)) return h.d.includes(tt)||h.w.includes(" "+tt);
  return h.w.includes(" "+tt); }); }
const CAT_ORDER=["Kardiologie","Konsile & Dienste","Intensiv & Notfall","Radiologie & Nuklear","Labor & Blut","Hämato & Onko","Innere Medizin","Chirurgie & OP","Neuro & Psych","Weitere Fächer","Stationen AKH","Verwaltung & Sonstiges"];
const SUB_ORDER={"Kardiologie":["Dienste & Pager","Herzkatheter","Stationen","Ambulanzen","Ärzt:innen","Forschung","Sekretariat & Leitung"]};
let telQ="", telCat=store.get("telcat","Kardiologie"), telSub="";
function favSet(){return new Set(store.get("favs2",[]))}
function favKey(e){return e.c+"|"+e.s+"|"+e.n}
function favEntries(){const f=favSet();return PHONES.entries.filter(e=>f.has(favKey(e)));}
function telRow(e,ctx){
  const fav=favSet().has(favKey(e));
  return '<div class="trow"><button class="star" type="button" data-fav="'+esc(favKey(e))+'" aria-pressed="'+fav+'" aria-label="Favorit">★</button><div class="main"><b>'+esc(e.n)+'</b>'+(ctx?' <span class="note">· '+esc(e.s)+'</span>':'')+
    (e.a?'<div class="note">auch: '+esc(e.a)+'</div>':'')+(e.note?'<div class="note">'+richNotes(e.note)+'</div>':'')+(e.nums.length?'<div class="nums">'+e.nums.map(n=>phoneBtn(n.v,n.l)).join("")+'</div>':'')+'</div></div>';
}
function subsOf(c){const s=[...new Set(PHONES.entries.filter(e=>e.c===c).map(e=>e.s))];const o=SUB_ORDER[c]||[];return s.sort((x,y)=>{const i=o.indexOf(x),j=o.indexOf(y);return (i<0?99:i)-(j<0?99:j)||x.localeCompare(y,"de");});}
function viewTel(){
  setSec("tel");tabs("tel");
  const cats=CAT_ORDER.filter(c=>PHONES.entries.some(e=>e.c===c));
  if(telCat!=="★"&&!cats.includes(telCat))telCat=cats[0];
  const chips='<div class="chips" role="group" aria-label="Kategorie"><button class="chip" type="button" data-c="★" aria-pressed="'+(telCat==="★")+'">★</button>'+cats.map(c=>'<button class="chip" type="button" data-c="'+esc(c)+'" aria-pressed="'+(telCat===c)+'">'+esc(c)+'</button>').join("")+'</div>';
  header({t:"Telefon & Pager",sub:"Suche durchsucht alle Kategorien",search:"Name, Stelle oder Nummer …",q:telQ,chips});
  show('<div class="chips sub" id="subs" role="group" aria-label="Unterkategorie"></div><div id="tl"></div><p class="hint">Nummer antippen = kopieren</p>');
  $("#q").addEventListener("input",e=>{telQ=e.target.value;drawTel();});
  document.querySelectorAll(".chip[data-c]").forEach(c=>c.addEventListener("click",()=>{telCat=c.dataset.c;telSub="";store.set("telcat",telCat);telQ="";const q=$("#q");if(q)q.value="";document.querySelectorAll(".chip[data-c]").forEach(x=>x.setAttribute("aria-pressed",String(x===c)));drawTel();}));
  drawTel();
}
function drawTel(){
  const el=$("#tl"),sb=$("#subs"); if(!el)return; const terms=norm(telQ).split(/\s+/).filter(Boolean); const f=favSet();
  const hay=e=>telHay(e);
  let list, grp;
  if(terms.length){ // Suche: immer über alle Kategorien
    sb.hidden=true;
    list=PHONES.entries.filter(e=>telMatch(e,terms));
    grp=e=>e.c+" · "+e.s;
  } else if(telCat==="★"){
    sb.hidden=true; list=PHONES.entries.filter(e=>f.has(favKey(e))); grp=e=>e.c;
  } else {
    const subs=subsOf(telCat);
    if(telSub&&!subs.includes(telSub))telSub="";
    sb.hidden=subs.length<2;
    sb.innerHTML='<button class="chip" type="button" data-s="" aria-pressed="'+(telSub==="")+'">Alle</button>'+subs.map(s=>'<button class="chip" type="button" data-s="'+esc(s)+'" aria-pressed="'+(telSub===s)+'">'+esc(s)+'</button>').join("");
    sb.querySelectorAll("[data-s]").forEach(b=>b.addEventListener("click",()=>{telSub=b.dataset.s;drawTel();}));
    list=PHONES.entries.filter(e=>e.c===telCat&&(!telSub||e.s===telSub)); grp=e=>e.s;
  }
  if(!list.length){el.innerHTML='<div class="list"><div class="empty">'+(telCat==="★"&&!terms.length?"Noch keine Favoriten. Stern antippen zum Merken.":"Keine Nummer gefunden.")+'</div></div>';return;}
  const by=new Map(); list.forEach(e=>{const k=grp(e);if(!by.has(k))by.set(k,[]);by.get(k).push(e);});
  const keys=[...by.keys()]; if(!terms.length&&telCat!=="★"){const o=subsOf(telCat);keys.sort((a,b)=>o.indexOf(a)-o.indexOf(b));}
  el.innerHTML='<div class="list">'+keys.map(k=>'<div class="dhead">'+esc(k)+'</div>'+by.get(k).sort((a,b)=>a.n.localeCompare(b.n,"de")).map(e=>telRow(e,false)).join("")).join("")+'</div>';
  wireTel(el);
}
function wireTel(root){
  root.querySelectorAll("[data-fav]").forEach(b=>b.onclick=()=>{const f=favSet();const k=b.dataset.fav;f.has(k)?f.delete(k):f.add(k);store.set("favs",[...f]);b.setAttribute("aria-pressed",String(f.has(k)));toast(f.has(k)?"Als Favorit gemerkt":"Favorit entfernt");});
}

// SOPs
function viewSopList(){
  setSec("sop");tabs("sop");
  header({t:"SOPs",sub:"Kardiologie · Arbeitsanweisungen · Formulare",search:"SOP suchen …"});
  const draw=(q)=>{const terms=norm(q).split(/\s+/).filter(Boolean);const m=s=>terms.every(t=>norm(JSON.stringify(s)).includes(t));
    const it=SOP.items.filter(m), fo=SOP.forms.filter(m);
    return (it.length?'<div class="list">'+it.map(s=>'<a class="row" href="#s-'+s.id+'"><div class="main"><b>'+esc(s.t)+'</b><div class="sub">'+esc(s.tabs.map(t=>t.t).join(" · "))+'</div></div><span class="chev">›</span></a>').join("")+'</div>':'')+
      (fo.length?'<h2 class="sec">Formulare & Zuweisungen</h2><div class="list">'+fo.map(f=>'<a class="row" href="#f-'+f.id+'"><div class="main"><b>'+esc(f.t)+'</b></div><span class="chev">›</span></a>').join("")+'</div>':'')+
      (!it.length&&!fo.length?'<div class="list"><div class="empty">Nichts gefunden.</div></div>':'');};
  show('<div id="sl">'+draw("")+'</div>');
  $("#q").addEventListener("input",e=>{$("#sl").innerHTML=draw(e.target.value);});
}
function viewSop(id){
  const s=SOP.items.find(x=>x.id===id); if(!s)return viewSopList();
  setSec("sop");tabs("sop");
  header({t:s.t,sub:s.stand,back:"sop"});
  const start=Math.min(store.get("soptab."+id,0),s.tabs.length-1);
  show('<div class="ttabs" role="tablist">'+s.tabs.map((t,i)=>'<button type="button" role="tab" data-tab="'+i+'" aria-pressed="'+(i===start)+'">'+esc(t.t)+'</button>').join("")+'</div><div class="card doc" id="tabc">'+renderBlocks(s.tabs[start].blocks)+'</div>'+'');
  wireTools(V);wireTel(V);
  V.querySelectorAll("[data-tab]").forEach(b=>b.addEventListener("click",()=>{V.querySelectorAll("[data-tab]").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));store.set("soptab."+id,+b.dataset.tab);const c=$("#tabc");c.innerHTML=renderBlocks(s.tabs[+b.dataset.tab].blocks);wireTools(c);wireTel(c);}));
}
function viewForm(id){
  const f=SOP.forms.find(x=>x.id===id); if(!f)return viewSopList();
  setSec("sop");tabs("sop");
  header({t:f.t,sub:"Formular",back:"sop"});
  show('<div class="card doc"><ul>'+f.info.map(i=>'<li>'+rich(i)+'</li>').join("")+'</ul></div>');
}

/* ---------- Kopieren ---------- */
let tt;
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("on"),1400);}
document.addEventListener("click",e=>{const b=e.target.closest("[data-copy]");if(!b)return;const v=b.dataset.copy;
  const ok=()=>toast(v+" kopiert");
  try{navigator.clipboard.writeText(v).then(ok,()=>{fallback(b);});}catch(err){fallback(b);}
  function fallback(el){const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r);toast(v);}
});

/* ---------- Routing (#start, #perfusor, #p-id, #nacht, #n-id, #tel, #sop, #s-id, #f-id) ---------- */
function go(){
  const h=decodeURIComponent(location.hash.slice(1));
  if(h==="perfusor")return viewPerfList();
  if(h==="rechner")return viewCalc();
  if(h.startsWith("p-"))return viewPerfDetail(h.slice(2));
  if(h==="nacht")return viewNachtList();
  if(h.startsWith("n-"))return viewNachtTopic(h.slice(2));
  if(h==="tel")return viewTel();
  if(h==="sop")return viewSopList();
  if(h.startsWith("s-"))return viewSop(h.slice(2));
  if(h.startsWith("f-"))return viewForm(h.slice(2));
  if(h==="panther")return viewPanList();
  if(h.startsWith("a-"))return viewPanDoc(h.slice(2));
  if(h.startsWith("ab-"))return viewAbx(h.slice(3));
  return viewHome();
}
document.addEventListener("click",e=>{const a=e.target.closest('a[href^="#"]');if(a)navStack++;});
window.addEventListener("hashchange",go);
const th=store.get("theme",null); if(th)document.documentElement.dataset.theme=th;
try{ if(typeof PERF==="undefined"||typeof PHONES==="undefined") throw 0; go(); }
catch(e){ V.innerHTML='<div class="card">Daten konnten nicht geladen werden.</div>'; }
try{ if("serviceWorker" in navigator && location.protocol==="https:" && window.self===window.top && document.querySelector('link[rel="manifest"]')) navigator.serviceWorker.register("sw.js").catch(()=>{}); }catch(e){}
})();
</script>
